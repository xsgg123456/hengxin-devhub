<!doctype html>
<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<html lang="zh-CN">
<head>

<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
<meta content="yes" name="apple-mobile-web-app-capable">
<meta content="default" name="apple-mobile-web-app-status-bar-style">
<title>管理人员 · 项目经理 · 完整原型 V2</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --line:#e4e8f0; --line2:#eef1f6;
  --tx:#1a2233; --tx2:#5b6779; --tx3:#8b96a8;
  --pri:#5d87ff; --pri-l:#eaf1ff;
  --ok:#13b99a; --ok-l:#e8f7ee;
  --warn:#f59b18; --warn-l:#fff2e8;
  --danger:#ff4d4f; --danger-l:#fdecec;
  --info:#0e7490;
  --r:14px; --sh:0 1px 2px rgba(20,30,50,.05),0 4px 14px rgba(20,30,50,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.55;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx);background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.11)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
label{display:block;font-size:13px;color:var(--tx2);margin:0 0 5px;font-weight:550}

/* ---------- top bar ---------- */
.topbar{background:linear-gradient(135deg,#1e3a8a 0%,#5d87ff 58%,#3b82f6 100%);color:#fff;padding:14px 0 16px;
  padding-top:calc(14px + env(safe-area-inset-top))}
.topbar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;flex:none}
.brand h1{font-size:18px;white-space:nowrap}
.brand .sub{font-size:12px;opacity:.82;font-weight:400}
.topbar .spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.16);display:flex;
  align-items:center;justify-content:center;flex:none}
.iconbtn svg{stroke:#fff}

/* ---------- sync bar ---------- */
.syncbar{background:#fff;border-bottom:1px solid var(--line)}
.syncbar .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}
.sync{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--tx2);font-weight:550}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx3);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.16)}
.dot.run{background:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.16);animation:pl 1s infinite}
.dot.off{background:var(--warn);box-shadow:0 0 0 3px rgba(234,88,12,.16)}
@keyframes pl{50%{opacity:.35}}
.tip{font-size:13px;color:var(--warn);background:var(--warn-l);border:1px solid #ffd9bf;
  padding:7px 11px;border-radius:10px;flex:1;min-width:200px}
.mini{font-size:13px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;
  color:var(--tx2);font-weight:550;min-height:36px}
.mini:hover{background:var(--pri-l);border-color:#c7dbff;color:var(--pri)}
.mini.danger:hover{background:var(--danger-l);border-color:#f7c9c9;color:var(--danger)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-top:14px}
.card > .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card > .hd h2{font-size:16px}
.card > .hd .spacer{flex:1}
.muted{color:var(--tx2);font-size:13px}

/* ---------- today ---------- */
.today{background:linear-gradient(180deg,#fff 0%,#fbfcfe 100%);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh);margin-top:14px;overflow:hidden}
.today .th{display:flex;align-items:center;gap:9px;padding:14px 16px 10px}
.today .th h2{font-size:16px}
.today .th .cnt{font-size:12px;font-weight:650;padding:2px 9px;border-radius:20px;background:var(--danger-l);color:var(--danger)}
.today .th .cnt.zero{background:var(--ok-l);color:var(--ok)}
/* 待办等级筛选按钮（紧急 / 需关注 / 常规），点击只保留该档 */
.today .th .tfs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tf{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  border:1px solid var(--line);background:#fff;color:var(--tx2);font-size:12px;cursor:pointer;
  min-height:26px;font-family:inherit}
.tf:hover{background:#f3f7fd;color:var(--tx)}
.tf i{width:7px;height:7px;border-radius:50%;flex:none}
.tf b{font-weight:700;color:var(--tx);font-size:12.5px}
/* 选中态必须和 hover 拉开距离：hover 是浅灰底，选中就是实心主色白字。
   此前两者只差一个浅蓝底，用户点完分不清「已选中」还是「鼠标划过」（2026-09-06 反馈）。 */
.tf.on{border-color:var(--pri);background:var(--pri);color:#fff;font-weight:650}
.tf.on:hover{background:var(--pri);color:#fff}
.tf.on i{box-shadow:0 0 0 2px rgba(255,255,255,.65)}
.tf.on b{color:#fff}
/* 人员多选 chip 选择器：联合开发负责人 / 次 IT 负责人 共用 */
.subpick{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.pchip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--tx2);
  font-size:14px;line-height:1;cursor:pointer;min-height:36px;transition:all .12s}
.pchip:hover{border-color:var(--pri);color:var(--pri)}
.pchip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.pchip.dis{opacity:.42;cursor:not-allowed}
.pchip.dis:hover{border-color:var(--line);color:var(--tx2)}
.subhint{margin-top:8px;font-size:12.5px;color:var(--tx2)}
.tlist{padding:0 10px 12px}
.titem{display:flex;align-items:center;gap:11px;padding:11px 8px;border-top:1px solid var(--line2)}
.titem:first-child{border-top:none}
.tbar{width:4px;align-self:stretch;border-radius:3px;background:var(--tx3);flex:none}
.tbar.danger{background:var(--danger)} .tbar.warn{background:var(--warn)} .tbar.info{background:var(--pri)}
.tmain{flex:1;min-width:0}
.ttitle{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta{font-size:12.5px;color:var(--tx2);margin-top:2px}
.tmeta .rd{color:var(--danger);font-weight:600}
.tmeta .og{color:var(--warn);font-weight:600}
.tact{flex:none}
.btn{padding:9px 15px;border-radius:10px;background:var(--pri);color:#fff;font-weight:600;font-size:14px;min-height:40px}
.btn:hover{background:#1d4ed8}
.btn.ghost{background:#fff;color:var(--tx2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--pri-l);color:var(--pri);border-color:#c7dbff}
.btn.sm{padding:7px 12px;font-size:13px;min-height:36px}
.btn.danger{background:var(--danger)}
.btn.wide{width:100%;margin-top:12px}
.empty{padding:22px 10px;text-align:center;color:var(--tx3);font-size:14px}

/* ---------- 侧边栏 + 二级页面 ---------- */
.shell{display:flex;align-items:flex-start}
.sidebar{width:212px;flex:none;position:sticky;top:0;align-self:flex-start;height:100vh;
  display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);
  padding:15px 10px 12px;box-sizing:border-box}
.main{flex:1;min-width:0;padding:16px 0 48px}
.nav{display:flex;flex-direction:column;gap:4px}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;padding:10px 11px;border-radius:10px;
  border:1px solid transparent;background:transparent;color:var(--tx2);font-size:14.5px;font-weight:600;
  text-align:left;min-height:44px}
.navbtn svg{flex:none;opacity:.82}
.navbtn .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn:hover{background:#f3f7fd;color:var(--tx)}
.navbtn.on{background:var(--pri-l);color:var(--pri);border-color:#d3e2fc}
.navbtn.on svg{opacity:1}
.navbadge{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:20px;background:var(--danger);
  color:#fff;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.navsec{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.05em;padding:2px 11px 8px}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--tx3);line-height:1.7}
.side-foot .dotrow{display:flex;align-items:center;gap:6px;margin-top:2px}
.pane{display:none} .pane.on{display:block}
.statgrid{margin-top:14px}

/* ---------- stats ---------- */
/* 字号向表格看齐（表格 .tbl 为 13.5px / 表头 12.5px），2026-09-06 用户要求整体缩小一档 */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.stat .k{font-size:11.5px;color:var(--tx2);font-weight:550}
.stat .v{font-size:18px;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.stat .v.red{color:var(--danger)} .stat .v.green{color:var(--ok)} .stat .v.blue{color:var(--pri)}
.stat .u{font-size:11.5px;color:var(--tx3);font-weight:500;margin-left:2px}

/* ---------- 关键指标柱形图（项目总览） ----------
   2026-09-06：由「SVG + viewBox 拉伸」改为纯 HTML/CSS 柱。
   原因：viewBox 只有 680，而卡片实际宽约 950px，整个画布被等比放大约 1.4 倍，
   12.5px 的柱顶数字被拉成 ~17px、11.5px 的标签拉成 ~16px，看着比表格文字大一圈；
   窄屏又反向缩到 6~7px 直接糊掉。改 flex/grid 布局后字号就是真实 px，随表格走。
   表格 .tbl = 13.5px、表头 12.5px，故柱顶数字 12.5px、底部标签 12px。 */
.ovchart{margin-top:12px;border-top:1px solid var(--line2);padding-top:7px}
.ovbars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
/* 整列都是热区：比只命中柱子宽得多，悬停不用瞄准 */
.ovcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  cursor:pointer;min-width:0}
.ovchart .obarnum{font-size:12.5px;font-weight:700;line-height:1.2;color:#1a2233;
  /* 2026-09-06：数字改挂在各柱顶端（见 .ovstack），底部留 3px 与柱身隔开 */
  margin-bottom:3px}
.ovchart .obarnum.zero{color:#9aa4b2}
/* 柱槽 = 数字区 18px（15px 行高 + 3px 间距）+ 柱区 58px。
   数字原先是 ovcol 的独立一行，5 个数字永远排在同一水平线上，与柱高脱节；
   现在数字与柱子同处一个底端对齐的 flex column，矮柱的数字会跟着降下来。 */
.ovtrack{width:100%;height:76px;margin-top:4px;display:flex;align-items:flex-end;
  justify-content:center;border-bottom:1px solid #e6eaf0}
.ovstack{height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;min-width:0}
.obar{width:40px;max-width:100%;min-height:3px;border-radius:5px 5px 0 0;transition:opacity .12s}
.ovchart .obarlab{font-size:12px;color:#5b6779;margin-top:6px;line-height:1.25;
  text-align:center;white-space:nowrap}
.ovchart-note{margin-top:6px;font-size:11px;color:var(--tx3)}
/* 悬停卡里的项目明细列表（指标柱形图用，结构沿用甘特图悬停卡） */
.gt-list{margin-top:4px}
.gt-li{font-size:12.5px;color:#1a2233;margin-top:6px;display:flex;gap:5px;
  align-items:baseline;flex-wrap:wrap}
.gt-sub{font-size:11.5px;color:#7b8698}
.gt-kv{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:#1a2233}
.gt-kv b{font-size:16px;font-weight:700}
.gt-f{color:var(--tx3);font-size:11.5px;font-weight:400}

/* ---------- filters ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{width:auto;min-width:110px;padding:8px 10px;min-height:38px}
.filters .grow{flex:1;min-width:150px}
/* —— 提出时间范围选择器（领星风格：快捷区间 + 双月日历）—— */
.dpwrap{position:relative;display:inline-block}
.dptrig{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 12px;
  border:1px solid var(--bd,#dde3ec);border-radius:8px;background:#fff;color:var(--tx,#1f2937);
  font-size:13.5px;cursor:pointer;white-space:nowrap}
.dptrig:hover{border-color:#93b4f8}
.dptrig.on{border-color:#5d87ff;color:#5d87ff;font-weight:600}
.dptrig .ph{color:#9aa4b2;font-weight:400}
.dppanel{position:absolute;top:calc(100% + 6px);left:0;z-index:60;display:flex;
  background:#fff;border:1px solid #e2e8f0;border-radius:10px;
  box-shadow:0 12px 32px rgba(15,23,42,.16);overflow:hidden}
.dpquick{width:96px;border-right:1px solid #eef1f6;padding:6px 0;display:flex;flex-direction:column}
.dpquick button{border:0;background:none;text-align:left;padding:8px 14px;font-size:13px;
  color:#374151;cursor:pointer;white-space:nowrap}
.dpquick button:hover{background:#f2f6ff;color:#5d87ff}
.dpcals{display:flex;padding:10px 14px 12px;gap:26px}
.dpcal{min-width:252px}
.dphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dphead b{font-size:14px;color:#1f2937}
.dpnav{display:flex;gap:2px}
.dpnav button{border:0;background:none;cursor:pointer;color:#6b7280;font-size:13px;
  width:22px;height:22px;border-radius:5px;line-height:1}
.dpnav button:hover{background:#eef2f8;color:#5d87ff}
.dpgrid{display:grid;grid-template-columns:repeat(7,30px);gap:2px;justify-content:center}
.dpwk{font-size:12px;color:#98a2b3;text-align:center;padding:4px 0}
.dpd{position:relative;border:0;background:none;font-size:12.5px;color:#374151;cursor:pointer;
  width:30px;height:28px;border-radius:6px}
.dpd:hover{background:#e8effc}
.dpd.mut{color:#c3cad4}
.dpd.in{background:#eef4ff;border-radius:0}
.dpd.end{background:#5d87ff;color:#fff;font-weight:600;border-radius:6px}
.dpd.end:hover{background:#1d4ed8}
.dpd.today:not(.end){box-shadow:inset 0 0 0 1.5px #93b4f8}
.dpfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-top:1px solid #eef1f6;padding:8px 14px}
.dpfoot .rng{font-size:12.5px;color:#6b7280}
.dpfoot button{border:0;background:none;cursor:pointer;font-size:13px;padding:5px 10px;border-radius:6px}
.dpfoot .clr{color:#98a2b3}
.dpfoot .clr:hover{background:#f3f4f6;color:#6b7280}
.dpfoot .ok{background:#5d87ff;color:#fff;font-weight:600}
.dpfoot .ok:hover{background:#1d4ed8}
@media(max-width:760px){
  .dppanel{position:fixed;left:8px;right:8px;top:auto;bottom:8px;flex-direction:column;
    max-height:72vh;overflow:auto;z-index:80}
  .dpquick{flex-direction:row;flex-wrap:wrap;width:auto;border-right:0;border-bottom:1px solid #eef1f6}
  .dpquick button{padding:8px 10px}
  .dpcals{overflow-x:auto}
}

/* ---------- project cards ---------- */
.pcards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}
.pcard.alert{border-color:#f7c9c9;background:linear-gradient(180deg,#fff 0%,#fffafa 100%)}
.pcard.warn{border-color:#ffd9bf;background:linear-gradient(180deg,#fff 0%,#fffbf7 100%)}
.pc-h{display:flex;align-items:flex-start;gap:8px}
.pc-t{font-size:15px;font-weight:650;flex:1;min-width:0}
.pc-c{font-size:11.5px;color:var(--tx3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:2px 8px;
  border-radius:20px;white-space:nowrap;flex:none}
.tag.p0{background:var(--danger-l);color:var(--danger)} .tag.p1{background:var(--warn-l);color:var(--warn)}
.tag.p2{background:#eef1f6;color:var(--tx2)}
.tag.s-doing{background:var(--pri-l);color:var(--pri)} .tag.s-done{background:var(--ok-l);color:var(--ok)}
.tag.s-block{background:var(--danger-l);color:var(--danger)} .tag.s-idle{background:#eef1f6;color:var(--tx2)}
.tag.s-cancel{background:#eef1f6;color:var(--tx3)}
.tag.bad{background:var(--danger);color:#fff} .tag.warn{background:var(--warn);color:#fff}
.pc-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:9px;font-size:12.5px;color:var(--tx2)}
.pc-meta b{color:var(--tx);font-weight:600}
.pc-prog{margin-top:10px}
.pc-prog .lb{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);margin-bottom:4px}
.pbar{height:8px;border-radius:6px;background:#eef1f6;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:6px;background:var(--pri)}
.pbar i.done{background:var(--ok)} .pbar i.bad{background:var(--danger)} .pbar i.warn{background:var(--warn)}
.pc-acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.pc-acts .btn{flex:1;min-width:88px}

/* ---------- phase strip ---------- */
.phases{display:flex;gap:3px;margin-top:10px}
.ph{flex:1;height:22px;border-radius:4px;background:#eef1f6;position:relative;cursor:help}
.ph.done{background:#a7e0bb} .ph.doing{background:#7aa7f7} .ph.block{background:#f3a4a4}
.ph .tip2{display:none;position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  background:#1a2233;color:#fff;font-size:11.5px;padding:5px 8px;border-radius:6px;white-space:nowrap;z-index:20;font-weight:500}
.ph:hover .tip2{display:block}

/* ---------- gantt ---------- */
.gwrap{border:1px solid var(--line);border-radius:12px;overflow:auto;background:#fff;max-height:600px}
.ginner{position:relative;min-width:max-content}
.grow{display:flex;align-items:stretch;border-bottom:1px solid var(--line2)}
.grow:last-child{border-bottom:none}
.glcol{position:sticky;left:0;z-index:3;background:#fff;width:168px;flex:none;padding:8px 10px;
  border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px}
.ghrow{position:sticky;top:0;z-index:5}
.ghrow .glcol{background:#f8fafd;z-index:6;font-size:12px;color:var(--tx2);font-weight:600;justify-content:center}
.ghrow{background:#f8fafd;border-bottom:1px solid var(--line)}
.gname{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsub{font-size:11.5px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtrack{flex:none;position:relative;display:block}
.gtrack svg{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2);margin-top:11px;align-items:center}
.legend i{display:inline-block;width:16px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
/* 甘特图进度条悬浮说明卡：固定定位避免被 gwrap 的 overflow 裁剪 */
.gtip{display:none;position:fixed;z-index:200;pointer-events:none;background:#fff;
  border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.14);
  padding:10px 12px;max-width:330px;font-size:12.5px;line-height:1.65;color:var(--tx)}

/* ============================================================
   AI IT 项目管理台
   架构分层（单向调用，严禁成环）：
     常量/工具 → 数据层(读写) → 计算层(聚合) → 渲染层(DOM)
     事件处理 → 数据层写 → refreshAll()（唯一刷新入口）
   ============================================================ */

/* ---------------- 常量 ---------------- */
var DB = {
  projects: 'weGlS4UnALRad62CEmvPEW',
  progress: 'YtUoTAlcVT3TD8iFQyHQlR',
  demands:  '9g9O0QqSs6vZ3sNZOiJygB',
  att:      '2Dg0b7T4neYmt3nf7ePZcL'
};
/* 七个环节（2026-09-06 用户要求删掉原第 8 环「运维复盘」，流程以验收交付收口）。
   改动面只有这一处常量：环节计划均分、进度序号、甘特图分段、填报下拉、演示数据
   全部走 PHASES.length / PHASES.indexOf，不需要再改别的地方。
   注意：历史项目若存过「运维复盘」，PHASES.indexOf 会返回 -1，相关展示已做兜底。 */
var PHASES = ['需求受理','立项评审','方案设计','开发编码','联调测试','上线部署','验收交付'];
var PHASE_DESC = {
  '需求受理':'确认需求来源、业务目标、影响范围，给出初步工作量估计（人天）',
  '立项评审':'完成优先级评估与资源排期，记录立项编号、评审结论、承诺交付时间',
  '方案设计':'输出技术方案/原型/接口设计，记录设计评审结论、关键技术选型、外部依赖',
  '开发编码':'记录本日完成模块、代码提交情况、整体编码完成比例、是否偏离排期',
  '联调测试':'记录用例执行数、通过率、遗留缺陷数、阻塞在哪个模块',
  '上线部署':'记录发布环境、版本号、上线时间、回滚方案、灰度比例',
  '验收交付':'记录验收结论、需求方签字情况、培训与文档交付状态；稳定运行指标与复盘结论也一并记在此环节'

    var p = { databaseId: DB[kind], pageSize: 100 };
    if(cursor) p.startCursor = cursor;
    return db.query(p).then(function(r){
      if(r && r.results) out = out.concat(r.results);

      if(r && r.hasMore && cursor) return step();
      return out;

  }

       : demandProps(obj);
}
function flushPending(){
  if(!state.cloudOK || !state.pending.length) return Promise.resolve();
  var q = state.pending.slice();
  state.pending = [];
  savePending();
  var chain = Promise.resolve();
  q.forEach(function(op){
    chain = chain.then(function(){
      if(op.op === 'add'){
        return cloudAdd(op.kind, propsOf(op.kind, op.obj)).then(function(res){
          var nid = newId(res);
          if(nid) remapId(op.kind, op.rid, nid);
        });
      } else if(op.op === 'update'){
        return cloudUpdate(op.kind, op.rid, propsOf(op.kind, op.obj));
      } else if(op.op === 'delete'){
        return cloudDelete(op.kind, op.rid);
      }
      return null;
    }).catch(function(){ state.pending.push(op); savePending(); });
  });
  return chain.then(function(){
    if(state.pending.length) setSync('offline');
    saveLocal();
  });
}
function remapId(kind, oldId, newId){
  if(kind === 'projects'){
    for(var i=0;i<state.projects.length;i++){
      if(state.projects[i].rid === oldId) state.projects[i].rid = newId;
    }
    for(var j=0;j<state.logs.length;j++){
      if(state.logs[j].pid === oldId) state.logs[j].pid = newId;
    }
  } else if(kind === 'progress'){
    for(var k=0;k<state.logs.length;k++){ if(state.logs[k].rid === oldId) state.logs[k].rid = newId; }
  } else {
    for(var m=0;m<state.demands.length;m++){ if(state.demands[m].rid === oldId) state.demands[m].rid = newId; }
  }
  saveLocal();
}

/* ---------------- 数据层：归一化 ---------------- */
function autoPhasePlan(s, e){
  if(!s || !e) return PHASES.map(function(k){ return { k:k, s:'', e:'' }; });
  var total = Math.max(1, dayDiff(s, e) + 1);
  var seg = total / PHASES.length;
  return PHASES.map(function(k, i){
    return { k:k, s: addDays(s, Math.round(i*seg)), e: addDays(s, Math.max(Math.round((i+1)*seg)-1, Math.round(i*seg))) };
  });
}
function normProject(r){

  if(!pp.length) pp = autoPhasePlan(dstr(r['计划开始']), dstr(r['计划完成']));
  if(!pr.length) pr = PHASES.map(function(k){ return { k:k, st:'未开始', p:0, e:'' }; });

/* 需求记录里只放附件「摘要」（名称/大小/类型/外链/附件表ID），不含 base64。
   真实数据单独存附件表，点开附件时才按需拉取——否则附件一多，需求列表加载会被拖垮。 */
function parseAttSummary(v){
  if(!v) return [];
  try {
    var arr = JSON.parse(v);
    if(!Array.isArray(arr)) return [];
    return arr.map(function(x){
      return { rid:(x.rid||''), name:(x.n||''), size:num(x.s),
               type:(x.t||''), media:(x.m||'file'), url:(x.u||'') };
    });
  } catch(e){ return []; }
}
function attSummaryOf(d){
  return JSON.stringify((d.atts || []).map(function(a){
    return { n:a.name, s:a.size, t:a.type, m:a.media, u:a.url || '', rid:a.rid || '' };
  }));
}
function mediaOf(name, mime){
  var m = (mime || '').toLowerCase();
  var ext = String(name || '').split('.').pop().toLowerCase();
  if(m.indexOf('image/') === 0) return 'image';
  if(m.indexOf('video/') === 0) return 'video';
  if(m.indexOf('audio/') === 0) return 'audio';
  if(['png','jpg','jpeg','gif','webp','bmp','svg'].indexOf(ext) >= 0) return 'image';
  if(['mp4','mov','avi','mkv','webm','flv'].indexOf(ext) >= 0) return 'video';
  if(['mp3','wav','m4a','aac'].indexOf(ext) >= 0) return 'audio';
  return 'file';
}
function fmtSize(n){
  n = num(n);
  if(n < 1024) return n + ' B';
  if(n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(2) + ' MB';
}

/* ---------------- 数据层：CRUD ---------------- */
function findProject(rid){
  for(var i=0;i<state.projects.length;i++) if(state.projects[i].rid === rid) return state.projects[i];
  return null;
}
function upsertProject(p, isNew){
  if(isNew){
    p.rid = uid();
    state.projects.push(p);
  } else {
    for(var i=0;i<state.projects.length;i++){
      if(state.projects[i].rid === p.rid){ state.projects[i] = p; break; }
    }
  }
  saveLocal();
  if(state.cloudOK){
    setSync('syncing');
    var req = isNew ? cloudAdd('projects', projectProps(p)) : cloudUpdate('projects', p.rid, projectProps(p));
    req.then(function(res){
      if(isNew){ var nid = newId(res); if(nid){ p.rid = nid; saveLocal(); } }
      setSync('online');
    }).catch(function(){ setSync('offline'); enqueue(isNew?'add':'update', 'projects', p.rid, p); });
  } else {
    enqueue(isNew?'add':'update', 'projects', p.rid, p);
  }
}
function removeProject(rid){
  state.projects = state.projects.filter(function(p){ return p.rid !== rid; });
  saveLocal();
  if(state.cloudOK){
    setSync('syncing');
    cloudDelete('projects', rid).then(function(){ setSync('online'); })
      .catch(function(){ setSync('offline'); enqueue('delete','projects',rid,null); });
  } else {
    enqueue('delete','projects',rid,null);
  }
}
function addLog(l){
  l.rid = uid();
  state.logs.push(l);
  saveLocal();
  if(state.cloudOK){
    setSync('syncing');
    cloudAdd('progress', logProps(l)).then(function(res){
      var nid = newId(res); if(nid){ l.rid = nid; saveLocal(); }
      setSync('online');
    }).catch(function(){ setSync('offline'); enqueue('add','progress',l.rid,l); });
  } else {
    enqueue('add','progress',l.rid,l);
  }
}
function upsertDemand(d, isNew){
  if(isNew){ d.rid = uid(); state.demands.push(d); }
  else {
    for(var i=0;i<state.demands.length;i++) if(state.demands[i].rid === d.rid){ state.demands[i] = d; break; }
  }
  saveLocal();
  // 返回 Promise：附件上传需要等需求记录落库并拿到真实 rid 才能做关联
  if(state.cloudOK){
    setSync('syncing');
    var req = isNew ? cloudAdd('demands', demandProps(d)) : cloudUpdate('demands', d.rid, demandProps(d));
    return req.then(function(res){
      if(isNew){ var nid = newId(res); if(nid){ d.rid = nid; saveLocal(); } }
      setSync('online');
      return d.rid;
    }).catch(function(){
      setSync('offline');
      enqueue(isNew?'add':'update','demands',d.rid,d);
      return d.rid;
    });
  }
  enqueue(isNew?'add':'update','demands',d.rid,d);
  return Promise.resolve(d.rid);
}

/* ---------------- 计算层 ---------------- */
function isDone(p){ return p.status === '已完成' || p.status === '已取消'; }
function isDelayed(p){ return !isDone(p) && !!p.planEnd && dayDiff(p.planEnd, TODAY) > 0; }
function staleDays(p){ return p.lastUpdate ? dayDiff(p.lastUpdate, TODAY) : 9999; }
function isStale(p){ return !isDone(p) && p.status !== '未开始' && staleDays(p) >= STALE_DAYS; }
function projTeam(p){ return uniq([p.owner].concat(p.members || []).concat(p.subOwners || []).filter(Boolean)); }
function overallProgress(p){
  if(p.status === '已完成') return 100;
  return Math.max(0, Math.min(100, num(p.progress)));
}
function statusClass(s){
  return s === '进行中' ? 's-doing' : s === '已完成' ? 's-done' : s === '已阻塞' ? 's-block'
       : s === '已取消' ? 's-cancel' : 's-idle';
}
function prioClass(p){ return p === 'P0' ? 'p0' : p === 'P1' ? 'p1' : 'p2'; }

function computeToday(){
  var items = [];
  state.projects.forEach(function(p){
    if(isDone(p)) return;
    var d = isDelayed(p), s = isStale(p);
    if(d || s){
      var parts = [];
      if(d) parts.push('已延期 ' + dayDiff(p.planEnd, TODAY) + ' 天');
      if(s) parts.push('已 ' + staleDays(p) + ' 天未更新进度');
      items.push({
        level: 'danger', title: p.name, pid: p.rid,
        meta: parts.join(' · ') + ' · 当前「' + p.phase + '」' + (p.owner ? ' · 负责人 ' + p.owner : ''),
        act: '立即填报', fn: "openProgressModal('" + p.rid + "')"
      });
    } else if(p.status === '进行中'){
      items.push({
        level: 'info', title: p.name, pid: p.rid,
        meta: '今日待更新进度 · 当前「' + p.phase + '」' + (p.planEnd ? ' · 计划完成 ' + p.planEnd : ''),
        act: '填报', fn: "openProgressModal('" + p.rid + "')"
      });
    } else if(p.status === '已阻塞'){
      items.push({
        level: 'warn', title: p.name, pid: p.rid,
        meta: '项目已阻塞 · 需协调资源' + (p.owner ? ' · 负责人 ' + p.owner : ''),
        act: '处理', fn: "openProgressModal('" + p.rid + "')"
      });
    }
  });
  state.demands.forEach(function(dm){
    if(dm.status === '待评估'){
      var age = dm.ctime ? dayDiff(dm.ctime.slice(0,10), TODAY) : 0;
      items.push({
        level: age >= 3 ? 'warn' : 'info', title: '【待评估需求】' + dm.title, pid: '',
        meta: dm.dept + ' · ' + dm.person + ' 提交' + (age >= 3 ? ' · 已等待 ' + age + ' 天' : ''),
        act: '评估受理', fn: "openDemandAssign('" + dm.rid + "')"
      });
    }
  });
  var order = { danger:0, warn:1, info:2 };
  items.sort(function(a,b){ return order[a.level] - order[b.level]; });
  return items;
}
/* 统计口径支持传入范围：项目总览页传筛选后的 list（让指标卡与明细、柱形图三者一致），
   顶栏统计行不传 = 全量。切勿在调用处另起一套过滤，否则会出现「卡片 10 个、图 6 个」。 */
function computeStats(list){
  var src = list || state.projects;
  var act = src.filter(function(p){ return !isDone(p); });
  return {
    total: src.length,
    active: act.length,
    doing: act.filter(function(p){ return p.status === '进行中'; }).length,
    delayed: act.filter(isDelayed).length,
    stale: act.filter(isStale).length,
    done: src.filter(function(p){ return p.status === '已完成'; }).length,
    waiting: state.demands.filter(function(d){ return d.status === '待评估'; }).length
  };
}
function allPeople(){
  var ps = [];
  state.projects.forEach(function(p){ ps = ps.concat(projTeam(p)); });
  return uniq(ps);
}
/* 人员候选：花名册在前，数据中实际出现过的其他姓名补在后面。
   用于筛选器与各处姓名输入候选——让录入与筛选共用同一份姓名，保证按人筛选能命中。
   注意：排名/负载仍用 allPeople()（只统计实际有项目的人），
   避免名下零项目的人因按期率回退值拿到 30 分空降榜首。 */
function filterPeople(){
  return uniq(TEAM.concat(allPeople()));
}
function computePeople(ym){
  var people = allPeople();
  var monthStart = ym + '-01';
  var monthEnd = ym + '-' + pad2(daysInMonth(ym));
  var rows = people.map(function(name){
    var mine = state.projects.filter(function(p){
      return p.owner === name || p.members.indexOf(name) >= 0 || (p.subOwners || []).indexOf(name) >= 0;
    });
    var inhand = mine.filter(function(p){ return !isDone(p); });
    var owned  = mine.filter(function(p){ return p.owner === name; });
    var delayed = inhand.filter(isDelayed);
    var stale = inhand.filter(isStale);
    var delayDays = 0;
    delayed.forEach(function(p){ delayDays += dayDiff(p.planEnd, TODAY); });

    // 本月完成环节数：按 (项目, 环节) 去重统计该人本月填报的「已完成」
    var seen = {}, donePhases = 0, updates = 0;
    state.logs.forEach(function(l){
      if(l.filler !== name) return;
      if(monthOf(l.date) !== ym) return;
      updates++;
      if(l.st === '已完成'){
        var key = l.pid + '|' + l.phase;
        if(!seen[key]){ seen[key] = 1; donePhases++; }
      }
    });
    // 按期率：只统计「本月内应交付且交付日已过」的项目，未到交付日的不判负
    var judged = owned.filter(function(p){
      return p.planEnd && p.planEnd >= monthStart && p.planEnd <= monthEnd && p.planEnd <= TODAY;
    });
    var onTime = judged.filter(function(p){
      return p.status === '已完成' && p.actualEnd && dayDiff(p.actualEnd, p.planEnd) >= 0;
    }).length;
    // 本月尚无已到期交付项时，退化为在手项目的纪律比值，避免月初全员 0 分
    var rate = judged.length ? onTime / judged.length
             : (inhand.length ? (inhand.length - delayed.length) / inhand.length : 1);

    var score = donePhases * 10 + rate * 30 - delayDays * 2 - stale.length * 5;
    return {
      name: name, inhand: inhand.length, owned: owned.length,
      done: mine.filter(function(p){ return p.status === '已完成'; }).length,
      delayed: delayed.length, delayDays: delayDays, stale: stale.length,
      donePhases: donePhases, updates: updates, judged: judged.length, onTime: onTime,
      rate: Math.round(rate * 100), score: Math.round(score * 10) / 10
    };
  });
  rows.sort(function(a,b){
    if(b.score !== a.score) return b.score - a.score;
    return b.inhand - a.inhand || a.name.localeCompare(b.name);
  });
  rows.forEach(function(r, i){ r.rank = i + 1; });
  return rows;
}
function ganttRows(ym){
  var ms = ym + '-01';
  var me = ym + '-' + pad2(daysInMonth(ym));
  var list = state.projects.filter(function(p){
    if(p.status === '已完成' || p.status === '已取消'){
      var ae = p.actualEnd || p.planEnd || '';
      return !!ae && ae >= ms && ae <= me;
    }
    // 未结项项目：一旦已（应）开工就持续留图，跨月延期不会被过滤掉，保证预警可见
    var s = p.planStart || p.planEnd || TODAY;
    return s <= me;
  });
  list.sort(function(a,b){
    var ad = isDelayed(a) ? 0 : 1, bd = isDelayed(b) ? 0 : 1;
    if(ad !== bd) return ad - bd;
    return (a.planStart || '').localeCompare(b.planStart || '');
  });
  return list;
}

function renderNav(){

  var html = '';

          + '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (PAGE_ICON[t.k] || '') + '</svg>'
          + '<span class="lb">' + t.n + '</span>'
          + (t.k === 'today' && danger ? '<span class="navbadge">' + danger + '</span>' : '')

  });
  el.innerHTML = html;

    var p = document.getElementById('pane-' + t.k);

  });
  // 关键指标、手头项目数图与项目明细只跟随项目总览页显隐（它们与 pane-overview 是平级节点，不受 pane 循环控制）

/* 项目总览页：关键指标卡（渲染到 #statsBox，位于筛选器与项目明细之间） */
/* ---------- 关键指标柱形图 ----------
   每个指标一根柱，柱高 = 项目数，鼠标悬停柱子弹出该指标包含的具体项目。
   口径必须与上方五张指标卡完全一致：同一份 filterProjects() 结果 + 同一套判定函数，
   否则会出现「卡片 5 个、柱子 6 个」这种对不上的情况。
   前四个指标只统计在手（未结项）项目，「已完成」单独取 status === '已完成'，
   与 computeStats().done 同源；已取消既不在手也不算完成，两个口径都不计入。 */
function statBuckets(list){
  var act = list.filter(function(p){ return !isDone(p); });
  return [
    { key:'active',  label:'在手项目',   color:'#5d87ff', items: act },
    { key:'doing',   label:'进行中',     color:'#64748b', items: act.filter(function(p){ return p.status === '进行中'; }) },
    { key:'delayed', label:'已延期',     color:'#ff4d4f', items: act.filter(isDelayed) },
    { key:'stale',   label:'超期未更新', color:'#f59b18', items: act.filter(isStale) },
    { key:'done',    label:'已完成',     color:'#13b99a', items: list.filter(function(p){ return p.status === '已完成'; }) }
  ];
}
/* 悬停卡正文：列出该指标命中的项目（名称 / 负责人 / 计划完成日），最多 8 条 */
function statTipHtml(b){
  var h = '<div class="gt-h">'
        + '<span class="tag" style="background:' + b.color + '1f;color:' + b.color + '">' + b.label + '</span>'
        + '<span>共 ' + b.items.length + ' 个项目</span></div>';
  if(!b.items.length){
    return h + '<div class="gt-note">当前筛选条件下没有命中该指标的项目。</div>';
  }
  h += '<div class="gt-list">';
  b.items.slice(0, 8).forEach(function(p){
    var late = isDelayed(p) ? '　<b style="color:#ff4d4f">延期 ' + dayDiff(p.planEnd, TODAY) + ' 天</b>' : '';
    h += '<div class="gt-li"><b>' + esc(p.name) + '</b>' + late + '</div>'

       // 已完成的项目看实际完成日更有意义，未完成的才有「计划完成 / 延期」
       + '　' + (p.actualEnd ? '实际完成 ' + esc(p.actualEnd)
                             : '计划完成 ' + esc(p.planEnd || '—')) + '</div>';
  });
  h += '</div>';
  if(b.items.length > 8){
    h += '<div class="gt-note">另有 ' + (b.items.length - 8) + ' 个未列出，可继续用下方筛选缩小范围。</div>';
  }

/* 纯 HTML 生成（不以 render 开头：它是 renderStats 的内部片段，不属于 refreshAll 的渲染函数） */
function overviewChartHtml(list){
  var buckets = statBuckets(list);
  var maxN = 1;
  buckets.forEach(function(b){ if(b.items.length > maxN) maxN = b.items.length; });
  // 柱区高度：柱子按此值等比缩放。CSS .ovtrack 另留 18px 给柱顶数字，总高 76px
  var BAR = 124;
  var s = '<div class="ovchart"><div class="ovbars">';
  buckets.forEach(function(b){
    var n = b.items.length;
    // 0 个时仍画 3px 底条：柱子不会凭空消失，也保证还能悬停看到「无命中」说明
    var bh = n ? Math.max(6, (n / maxN) * BAR) : 3;
    // 整列（数字 + 柱子 + 标签）都是热区，比只命中柱子宽得多，悬停不用瞄准。
    // 注意：内联事件属性里只有全局的 event，写 ev 会抛 ReferenceError（整块悬停失效）。
    // enter 生成内容、move 只跟随位置，避免每次移动都重绘。
    s += '<div class="ovcol"'
       + ' onmouseenter="statTip(event,\'' + b.key + '\')"'
       + ' onmousemove="gTipMove(event)"'
       + ' onmouseleave="gTipHide()">'
       // 数字与柱子放进同一个 .ovstack（底端对齐）：数字随柱高上下浮动，不再排成一条直线
       + '<div class="ovtrack"><div class="ovstack">'
       + '<div class="obarnum' + (n ? '' : ' zero') + '">' + n + '</div>'
       + '<div class="obar" data-key="' + b.key + '"'
       + ' style="height:' + bh.toFixed(1) + 'px;background:' + (n ? b.color : '#dfe4ec') + '"></div>'
       + '</div></div>'
       + '<div class="obarlab">' + b.label + '</div>'
       + '</div>';
  });
  s += '</div>'
     + '<div class="ovchart-note">柱高 = 项目数　<b style="color:#5d87ff">鼠标移到柱子上</b>，即可看到该指标下有哪些具体项目'
     + '　口径跟随下方状态 / 人员 / 计划完成日筛选</div></div>';
  return s;
}
/* 悬停高亮：命中的柱子保持原色，其余淡出，给「这里能交互」的即时反馈。
   统一走 style.opacity（2026-09-06 修正）：此前用 setAttribute('opacity')，
   该属性只对 SVG 元素有效，关键指标柱形图改成 HTML 柱后高亮一直静默失效。 */
function hiApply(nodes, attr, val){
  for(var i = 0; i < nodes.length; i++){
    nodes[i].style.opacity = (nodes[i].getAttribute(attr) === String(val)) ? '1' : '0.3';
  }
}
function hiClear(nodes){
  for(var i = 0; i < nodes.length; i++) nodes[i].style.opacity = '1';
}
function ovHi(key){
  hiApply(document.querySelectorAll('#statsBox .obar'), 'data-key', key);
}
function ovHiClear(){
  hiClear(document.querySelectorAll('#statsBox .obar'));
}

/* 待办等级筛选（事件层）：只改 state 再走统一刷新入口，不在渲染函数里互调 */

/* 项目筛选（计算层）：指标卡柱形图与项目明细必须共用这一份结果，
   否则会出现「卡片 10 个、明细只有 6 条」的口径打架。新增筛选条件只改这里一处。 */
function filterProjects(){
  return state.projects.filter(function(p){
    if(state.fStatus && p.status !== state.fStatus) return false;
    if(state.fOwner){
      if(p.owner !== state.fOwner && p.members.indexOf(state.fOwner) < 0 && (p.subOwners || []).indexOf(state.fOwner) < 0) return false;
    }
    // 计划完成日区间（双月日历，闭区间）：没填计划完成日的项目在筛选时排除
    var pe = dstr(p.planEnd);
    if(state.opDateA && (!pe || pe < state.opDateA)) return false;
    if(state.opDateB && (!pe || pe > state.opDateB)) return false;
    return true;
  });
}

function renderOverviewList(){
  var el = document.getElementById('ovList');

  var list = filterProjects();
  // 排序口径（2026-09-05 确认为「计划完成日临近优先」）：
  // 1) 未结项在前，已结项（已完成 / 已取消）沉到最后
  // 2) 有交付日的在前，无交付日的兜底排最后
  // 3) 交付日升序：已超期的最早 → 排最前（延期项目自动置顶），越临近到期越靠前
  // 4) 同一交付日再按优先级 P0 → P1 → P2
  list.sort(function(a,b){

    var ae = a.planEnd || '', be = b.planEnd || '';

  }
  h += '</div>';
  el.innerHTML = h;

/* 甘特图左侧列文案：原来只显示「+人数」看不出是谁，改为直接列出联合开发姓名；人多了才折叠 */
function gTeamTxt(p){

function gTip(ev, rid){
  var box = document.getElementById('gtip');
  var p = state.projects.filter(function(x){ return x.rid === rid; })[0];
  if(!box || !p) return;
  box.innerHTML = ganttTipHtml(p);

function gTipMove(ev){
  var box = document.getElementById('gtip');
  if(!box || box.className.indexOf('on') < 0) return;
  var pad = 14, w = box.offsetWidth, h = box.offsetHeight;
  var cx = ev.clientX || 0, cy = ev.clientY || 0;
  var x = cx + pad, y = cy + pad;
  if(x + w > window.innerWidth - 8)  x = cx - w - pad;   // 靠右时向左翻转
  if(y + h > window.innerHeight - 8) y = cy - h - pad;   // 靠下时向上翻转
  if(x < 8) x = 8;
  if(y < 8) y = 8;
  box.style.left = x + 'px';
  box.style.top  = y + 'px';
}

/* 提出时间范围选择器（领星风格）：快捷区间 + 双月日历。
   面板由 dpPanelHtml() 拼串，交互函数改 state 后走 renderDemands() 重绘，符合单向调用铁律。 */
var DP_QUICKS = ['今日','昨日','最近7天','最近14天','最近30天','本月','上月','本年','去年'];
function dpQuickRange(name){ /* 快捷区间 → [起, 止]；解析失败返回 null */
  var ym = TODAY.slice(0,7);
  var boY = +ym.slice(0,4), boM = +ym.slice(5,7);
  switch(name){
    case '今日':     return [TODAY, TODAY];
    case '昨日':     return [addDays(TODAY,-1), addDays(TODAY,-1)];
    case '最近7天':  return [addDays(TODAY,-6), TODAY];
    case '最近14天': return [addDays(TODAY,-13), TODAY];
    case '最近30天': return [addDays(TODAY,-29), TODAY];
    case '本月':     return [ym + '-01', addDays(shiftMonth(ym,1) + '-01', -1)];
    case '上月':     var pm = shiftMonth(ym,-1); return [pm + '-01', addDays(ym + '-01', -1)];
    case '本年':     return [boY + '-01-01', boY + '-12-31'];
    case '去年':     return [(boY-1) + '-01-01', (boY-1) + '-12-31'];
  }
  return null;
}
function fmtYm(ym){ var p = ym.split('-'); return (+p[0]) + ' 年 ' + (+p[1]) + ' 月'; }
function dpMonthGrid(ym){ /* 6×7=42 格，周一起始；in=false 为邻月补位日 */
  var first = ym + '-01';
  var lead = (parseDate(first).getDay() + 6) % 7;   // 周一=0
  var start = addDays(first, -lead);
  var cells = [];
  for(var i=0;i<42;i++){
    var d = addDays(start, i);
    cells.push({ d:d, in: d.slice(0,7) === ym });
  }
  return cells;
}
/* 通用双月日历范围面板：需求池「提出时间」与项目总览「计划完成日」共用同一份渲染实现，
   两者的差异只有「当前区间值」和「点击后的回调函数名」，全部由 cfg 传入——
   不去复制第二份 60 行几乎一样的代码，否则改样式要改两处、迟早不一致。
   cfg = { open, anchor, a, b, nav, pick, quick, clear, done }（后五项为回调名字符串） */
function calPanelHtml(cfg){
  if(!cfg.open) return '';
  var anchor = cfg.anchor || curMonth();
  var a = anchor, b = shiftMonth(a, 1);
  var A = cfg.a, B = cfg.b;
  function cal(ym, nav){
    var cells = dpMonthGrid(ym).map(function(c){
      var cls = 'dpd' + (c.in ? '' : ' mut');
      if(A && B && c.d >= A && c.d <= B) cls += ' in';
      if((c.d === A) || (c.d === B)) cls += ' end';
      if(c.d === TODAY) cls += ' today';
      return '<button type="button" class="' + cls + '" onclick="' + cfg.pick + '(\'' + c.d + '\')">' + (+c.d.slice(8,10)) + '</button>';
    }).join('');
    var wk = ['一','二','三','四','五','六','日'].map(function(w){ return '<span class="dpwk">' + w + '</span>'; }).join('');
    return '<div class="dpcal">'
      + '<div class="dphead"><b>' + fmtYm(ym) + '</b>'
      + '<span class="dpnav">'
      + '<button type="button" title="上一年" onclick="' + cfg.nav + '(' + (nav?-12:12) + ')">«</button>'
      + '<button type="button" title="上一月" onclick="' + cfg.nav + '(' + (nav?-1:1) + ')">‹</button>'
      + '</span></div>'
      + '<div class="dpgrid">' + wk + cells + '</div></div>';
  }
  var quicks = DP_QUICKS.map(function(q){
    return '<button type="button" onclick="' + cfg.quick + '(\'' + q + '\')">' + q + '</button>';
  }).join('');
  var rngTxt = (A && B) ? A + ' ~ ' + B : '请选择起止日期';
  return '<div class="dppanel">'
    + '<div class="dpquick">' + quicks + '</div>'
    + '<div><div class="dpcals">' + cal(a,true) + cal(b,false) + '</div>'
    + '<div class="dpfoot"><span class="rng">' + rngTxt + '</span>'
    + '<span><button type="button" class="clr" onclick="' + cfg.clear + '()">清空</button>'
    + '<button type="button" class="ok" onclick="' + cfg.done + '()">确定</button></span></div></div></div>';
}

/* ---------- 需求池统计：按提出人统计数量与占比 ----------
   口径：完全跟随当前筛选（部门 / 提出时间 / 关键词），传入的 list 就是筛选结果 */
var STAT_COLORS = ['#5d87ff','#0ea5e9','#13b99a','#f59e0b','#8b5cf6','#14b8a6','#ec4899','#f97316','#64748b','#ff4d4f'];
function shortName(s, n){ s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; }
/* 最近一次渲染的统计行缓存：悬停卡按行下标取数据，避免把提出人姓名拼进内联事件属性
   （姓名里的引号会截断 onclick 字符串，且难转义） */
var DSTAT_ROWS = [];
function demandStatRows(list){
  var m = {}, total = 0;
  list.forEach(function(d){
    var k = (d.person || '').trim() || '未填写提出人';
    // items 保留该提出人名下的原始需求，供悬停卡列明细（2026-09-06 新增）
    if(!m[k]) m[k] = { name:k, n:0, items:[] };
    m[k].n++; m[k].items.push(d); total++;
  });
  var names = Object.keys(m);
  var rows = names.map(function(k){ return m[k]; });
  rows.sort(function(a,b){ return b.n - a.n || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0); });
  // 提出人多于 10 人时，把长尾合并为「其他」，避免图表被切成一堆细条。
  // 合并必须带上 items（长尾所有人拼在一起），否则悬停「其他 N 人」看不到任何明细
  if(rows.length > 10){
    var head = rows.slice(0, 9), rest = rows.slice(9), rn = 0, ri = [];
    rest.forEach(function(x){ rn += x.n; ri = ri.concat(x.items); });
    head.push({ name:'其他 ' + rest.length + ' 人', n:rn, items:ri });
    rows = head;
  }
  rows.forEach(function(r){ r.pct = total ? (r.n / total * 100) : 0; });
  return { total: total, people: names.length, rows: rows };
}
/* 纯 HTML 生成（不以 render 开头：它是 renderDemands 的内部片段，不属于 refreshAll 的渲染函数） */
function demandStatsHtml(list){
  var st = demandStatRows(list);
  if(!st.total){ DSTAT_ROWS = []; return ''; }
  DSTAT_ROWS = st.rows;   // 供 dstatTip 按下标取明细
  var rows = st.rows, total = st.total, top = rows[0];
  var maxN = 1;
  rows.forEach(function(r){ if(r.n > maxN) maxN = r.n; });
  var s = '<div class="dstat"><div class="dstat-kpi">'
    + '<span>需求总数 <b>' + total + '</b> 条</span><i class="sep"></i>'
    + '<span>提出人 <b>' + st.people + '</b> 人</span><i class="sep"></i>'
    + '<span>人均 <b>' + (total / st.people).toFixed(1) + '</b> 条</span><i class="sep"></i>'
    + '<span>最多 <b>' + esc(top.name) + '</b> ' + top.n + ' 条 · ' + top.pct.toFixed(1) + '%</span>'
    + '<div class="spacer"></div>'
    + '<span class="muted">口径：跟随上方筛选条件</span></div>'
    + '<div class="dstat-body">';
  // 左：环形占比图。SVG 固定 132×132（1:1 渲染，不随卡片宽度放大），
  // 段长按占比换算 dasharray，段间留 1.8 缝隙便于分辨；中心数字改 HTML 文字，字号与表格一致。
  var DR = 132, DC = DR / 2, R = 52, C = 2 * Math.PI * R;
  s += '<div class="dring"><svg viewBox="0 0 ' + DR + ' ' + DR + '" width="' + DR + '" height="' + DR + '">'
     + '<g transform="rotate(-90 ' + DC + ' ' + DC + ')">'
     + '<circle cx="' + DC + '" cy="' + DC + '" r="' + R + '" fill="none" stroke="#eef1f6" stroke-width="15"></circle>';
  var off = 0;
  rows.forEach(function(r, i){
    var len = C * r.n / total;
    var draw = Math.max(0.8, len - 1.8);
    // 环形段本身即可命中（SVG 默认 visiblePainted，只对已绘制的 dash 段响应），
    // 直接绑事件，不再用 <title>：原生 tooltip 会与自定义悬停卡同时弹出，互相遮挡
    s += '<circle class="dseg" data-idx="' + i + '" cx="' + DC + '" cy="' + DC + '" r="' + R + '" fill="none"'
       + ' stroke="' + STAT_COLORS[i % STAT_COLORS.length] + '"'
       + ' stroke-width="15" stroke-dasharray="' + draw.toFixed(2) + ' ' + (C - draw).toFixed(2) + '"'
       + ' stroke-dashoffset="' + (-off).toFixed(2) + '" style="cursor:pointer"'
       + ' onmouseenter="dstatTip(event,' + i + ')" onmousemove="gTipMove(event)" onmouseleave="gTipHide()"></circle>';
    off += len;
  });
  s += '</g></svg>'
     + '<div class="dring-cap"><div class="dring-n">' + total + '</div><div class="dring-l">需求总数</div></div>'
     + '</div>';
  // 右：条形排行（条长按数量占最大值的比例，右侧标出数量与占比）
  // 色块与柱条都带 data-idx：悬停高亮时同行两个元素一起亮/一起淡出
  s += '<div class="drank">';
  rows.forEach(function(r, i){
    var col = STAT_COLORS[i % STAT_COLORS.length];
    var w = Math.max(2, (r.n / maxN) * 100);
    s += '<div class="drank-row" title="' + esc(r.name) + '"'
       + ' onmouseenter="dstatTip(event,' + i + ')" onmousemove="gTipMove(event)" onmouseleave="gTipHide()">'
       + '<i class="dbar" data-idx="' + i + '" style="background:' + col + '"></i>'
       + '<span class="dname">' + esc(shortName(r.name, 6)) + '</span>'
       + '<span class="dtrack"><i class="dbar" data-idx="' + i + '"'
       + ' style="width:' + w.toFixed(1) + '%;background:' + col + '"></i></span>'
       + '<span class="dval">' + r.n + ' 条 · ' + r.pct.toFixed(1) + '%</span>'
       + '</div>';
  });
  s += '</div></div>'
     + '<div class="dstat-note">柱长按需求条数等比绘制　鼠标悬停环形色段或柱条，可查看该提出人名下的需求明细</div>'
     + '</div>';
  return s;
}
/* ---------- 需求池统计悬停明细 ----------
   与项目总览关键指标柱形图同一套交互：整行热区 + #gtip 浮层 + 命中项高亮。
   列出该提出人名下的需求：标题 / 优先级 / 状态 / 提出部门 / 期望完成 / 承接人。
   注意：事件属性只能用全局 event，写 ev 会抛 ReferenceError 让悬停静默失效。 */
/* 悬停卡的需求明细列表（提出人看板 / 部门看板共用）
   thirdKey 决定副行第三个字段：'dept' 显示提出部门，'person' 显示提出人 —— 看板按哪个维度分组，
   就补上另一个维度，否则卡片上只有一侧信息，看不出需求的全貌 */
function tipDemandList(items, thirdKey, limit){
  if(!items.length) return '<div class="gt-note">没有可列出的需求。</div>';
  var h = '<div class="gt-list">';
  items.slice(0, limit).forEach(function(d){
    var third = thirdKey === 'dept'
      ? (d.dept || '未填部门')
      : ((d.person || '').trim() || '未填提出人');
    h += '<div class="gt-li"><b>' + esc(d.title || '未命名需求') + '</b></div>'
       + '<div class="gt-sub">' + esc(d.prio || '—') + '　' + esc(d.status || '—')
       + '　' + esc(third)
       + '　期望完成 ' + esc(d.expect || '—')
       + (d.owner ? '　承接 ' + esc(d.owner) : '') + '</div>';
  });
  h += '</div>';
  if(items.length > limit){
    h += '<div class="gt-note">另有 ' + (items.length - limit) + ' 条未列出，可用上方筛选缩小范围。</div>';
  }
  return h;
}
function dstatTipHtml(row){
  if(!row) return '';
  var h = '<div class="gt-h"><span style="font-weight:700;font-size:13.5px">' + esc(row.name) + '</span>'
        + '<span class="muted">' + row.n + ' 条 · 占 ' + row.pct.toFixed(1) + '%</span></div>';
  // 提出人看板：副行补「部门」（提出人已在卡片标题里）
  return h + tipDemandList(row.items, 'dept', 8);
}
function dstatTip(ev, idx){
  var box = document.getElementById('gtip');
  if(!box) return;
  ev = ev || (typeof window !== 'undefined' ? window.event : null) || { clientX: 0, clientY: 0 };
  var tip = dstatTipHtml(DSTAT_ROWS[idx]);
  if(!tip){ gTipHide(); return; }
  box.innerHTML = tip;
  box.className = 'gtip on';
  gTipMove(ev);
  dstatHi(idx);
}
/* 高亮：命中提出人的环形段与柱条保持不透明，其余淡出 */
/* 拆成两次单选择器查询（不用逗号组合）：一是便于测试桩解析，二是两类元素分开取更直观 */
function dstatHi(idx){
  hiApply(dstatNodes(), 'data-idx', idx);
}
function dstatHiClear(){
  hiClear(dstatNodes());
}
function dstatNodes(){
  var a = document.querySelectorAll('#pane-demand .dseg') || [];
  var b = document.querySelectorAll('#pane-demand .dbar') || [];
  var out = [], i;
  for(i = 0; i < a.length; i++) out.push(a[i]);
  for(i = 0; i < b.length; i++) out.push(b[i]);
  return out;
}

/* ========== 需求池「部门看板」：数量 / 明细 / 占比趋势 ==========
   与「提出人统计」平级，挂在需求池筛选器下方，口径同样跟随当前筛选（传筛选后的 list）。
   三个诉求的落点：
     数量 → 环形占比 + 条形排行（按部门分组）
     明细 → 悬停环段 / 柱条 / 趋势柱，列出该范围内的需求
     趋势 → 按提出时间分桶的堆叠柱形，看各部门需求量随时间的变化与占比
   时间字段统一取 ctime 的日期部分，与「提出时间」筛选器同源。
   悬停数据走独立缓存 DDEPT_ROWS（下标寻址），不与提出人看板共用，避免两套数据互相污染。 */
var DDEPT_ROWS = [];
/* 按部门分组（结构与 demandStatRows 同构：长尾合并必须带 items，否则悬停合并行无内容） */
function demandDeptRows(list){
  var m = {}, total = 0;
  list.forEach(function(d){
    var k = (d.dept || '').trim() || '未填写部门';
    if(!m[k]) m[k] = { name:k, n:0, items:[] };
    m[k].n++; m[k].items.push(d); total++;
  });
  var rows = Object.keys(m).map(function(k){ return m[k]; });
  rows.sort(function(a,b){ return b.n - a.n || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0); });
  var depts = rows.length;
  if(rows.length > 10){
    var head = rows.slice(0, 9), rest = rows.slice(9), rn = 0, ri = [];
    rest.forEach(function(x){ rn += x.n; ri = ri.concat(x.items); });
    head.push({ name:'其他 ' + rest.length + ' 个部门', n:rn, items:ri });
    rows = head;
  }
  rows.forEach(function(r){ r.pct = total ? (r.n / total * 100) : 0; });
  return { total: total, depts: depts, rows: rows };
}
/* 自然月刻度文案：1 月带上年份，避免跨年时两个「1 月」标签分不清 */
function monthLabel(ym){
  var m = +ym.slice(5,7);
  return m === 1 ? ym.slice(2,4) + ' 年 1 月' : m + ' 月';
}
function monthEnd(ym){ return ym + '-' + pad2(daysInMonth(ym)); }
/* 趋势图时间范围（单位固定为自然月，2026-09-06 用户要求：不要按周，默认近 6 个月）。
   联动规则：设了「提出时间」筛选器就按其起止所在的自然月取区间，否则回退到近 TREND_MONTHS 个自然月
   （含当月）。区间只影响趋势图，部门分布（KPI/环形/条形）仍统计筛选后的全部需求。 */
var TREND_MONTHS = 6;
function trendRange(){
  var a = state.fDateA, b = state.fDateB, ya, yb;
  if(a && b){
    ya = a.slice(0,7); yb = b.slice(0,7);
    if(yb < ya) yb = ya;   // 防御：筛选器被写成倒序区间时不至于生成空桶
    return { from: ya + '-01', to: monthEnd(yb), ya: ya, yb: yb, mode:'filter' };
  }
  if(a){    // 只填了起点（筛选器支持单边）：终点取当月，但不得早于起点所在月
    ya = a.slice(0,7); yb = curMonth();
    if(yb < ya) yb = ya;
    return { from: ya + '-01', to: monthEnd(yb), ya: ya, yb: yb, mode:'filter' };
  }
  var ym = curMonth();
  ya = shiftMonth(ym, -(TREND_MONTHS - 1));
  return { from: ya + '-01', to: monthEnd(ym), ya: ya, yb: ym, mode:'recent' };
}
/* 部门看板全量数据：分布行 + 时间桶（桶内再按部门分组） */
function demandDeptBoard(list){
  var dr = demandDeptRows(list);
  // 趋势只画前 6 个部门，其余并入「其他部门」：部门多了堆叠段会碎成一片，看不出趋势
  var seq = dr.rows.slice(0, 6);
  var seqNames = seq.map(function(r){ return r.name; });
  // 时间桶固定按自然月切（不再按跨度自动切换日/周/月/年）。
  // 区间来自 trendRange()：跟随「提出时间」筛选器，未筛选时取近 6 个自然月。
  var buckets = [], outside = 0, i;
  var rg = trendRange();
  // 一条提出时间都没有时不画趋势：6 个空月份纯属噪声（此时分布图仍照常统计总数）
  var hasTime = false;
  for(i = 0; i < list.length; i++){ if(dstr(list[i].ctime)){ hasTime = true; break; } }
  if(hasTime){
    var cur = rg.from, guard = 0;
    while(cur <= rg.to && guard < 120){   // 120 桶上限，防御脏数据导致的死循环
      var ym = cur.slice(0,7);
      buckets.push({ label: monthLabel(ym), ym: ym, from: cur, to: monthEnd(ym),
                     items: [], byDept: [], pct: 0 });
      cur = shiftMonth(ym, 1) + '-01'; guard++;
    }
    list.forEach(function(d){
      var t2 = dstr(d.ctime);
      if(!t2) return;
      for(var j = 0; j < buckets.length; j++){
        if(t2 >= buckets[j].from && t2 <= buckets[j].to){ buckets[j].items.push(d); return; }
      }
      outside++;   // 落在区间外（早于近 6 个月）：不计入趋势，但分布图仍算它
    });
  }
  var maxB = 1;
  buckets.forEach(function(bk){
    var m = {};
    bk.items.forEach(function(d){
      var k = (d.dept || '').trim() || '未填写部门';
      if(seqNames.indexOf(k) < 0) k = '其他部门';
      m[k] = (m[k] || 0) + 1;
    });
    bk.byDept = seqNames.concat(['其他部门']).map(function(n, ix){
      return { name:n, n:m[n] || 0, ci:(ix < seqNames.length ? ix : 9) };   // 颜色索引沿用分布图，保证同部门同色
    }).filter(function(x){ return x.n > 0; });
    bk.byDept.forEach(function(x){ x.pct = bk.items.length ? (x.n / bk.items.length * 100) : 0; });
    if(bk.items.length > maxB) maxB = bk.items.length;
  });
  return { total: dr.total, depts: dr.depts, rows: dr.rows, seq: seq,
           buckets: buckets, maxB: maxB, range: rg, outside: outside };
}
/* 纯 HTML 生成（不以 render 开头：它是 renderDemands 的内部片段，不属于 refreshAll 的渲染函数） */
function demandDeptHtml(list){
  var bd = demandDeptBoard(list);

  var rows = bd.rows, total = bd.total, top = rows[0];

  DDEPT_ROWS = [];
  rows.forEach(function(r){ DDEPT_ROWS.push({ kind:'dept', row:r }); });
  bd.buckets.forEach(function(bk){ DDEPT_ROWS.push({ kind:'trend', bk:bk }); });
  var tOff = rows.length;
  var maxN = 1;
  rows.forEach(function(r){ if(r.n > maxN) maxN = r.n; });
  var s = '<div class="dstat"><div class="dstat-kpi">'
    + '<span>需求总数 <b>' + total + '</b> 条</span><i class="sep"></i>'
    + '<span>覆盖部门 <b>' + bd.depts + '</b> 个</span><i class="sep"></i>'
    + '<span>部门均量 <b>' + (total / bd.depts).toFixed(1) + '</b> 条</span><i class="sep"></i>'
    + '<span>最多 <b>' + esc(top.name) + '</b> ' + top.n + ' 条 · ' + top.pct.toFixed(1) + '%</span>'
    + '<div class="spacer"></div>'
    + '<span class="muted">口径：跟随上方筛选条件</span></div>'
    + '<div class="dstat-body">';
  // 左：环形占比（固定 132×132，1:1 渲染；结构与提出人看板一致，只换 class 与事件函数名）
  var DR = 132, DC = DR / 2, R = 52, C = 2 * Math.PI * R;
  s += '<div class="dring"><svg viewBox="0 0 ' + DR + ' ' + DR + '" width="' + DR + '" height="' + DR + '">'
     + '<g transform="rotate(-90 ' + DC + ' ' + DC + ')">'
     + '<circle cx="' + DC + '" cy="' + DC + '" r="' + R + '" fill="none" stroke="#eef1f6" stroke-width="15"></circle>';
  var off = 0;
  rows.forEach(function(r, i){
    var len = C * r.n / total;
    var draw = Math.max(0.8, len - 1.8);
    s += '<circle class="ddseg" data-idx="' + i + '" cx="' + DC + '" cy="' + DC + '" r="' + R + '" fill="none"'
       + ' stroke="' + STAT_COLORS[i % STAT_COLORS.length] + '"'
       + ' stroke-width="15" stroke-dasharray="' + draw.toFixed(2) + ' ' + (C - draw).toFixed(2) + '"'
       + ' stroke-dashoffset="' + (-off).toFixed(2) + '" style="cursor:pointer"'
       + ' onmouseenter="ddeptTip(event,' + i + ')" onmousemove="gTipMove(event)" onmouseleave="gTipHide()"></circle>';
    off += len;
  });
  s += '</g></svg>'
     + '<div class="dring-cap"><div class="dring-n">' + total + '</div><div class="dring-l">需求总数</div></div>'
     + '</div>';
  // 右：条形排行
  s += '<div class="drank">';
  rows.forEach(function(r, i){
    var col = STAT_COLORS[i % STAT_COLORS.length];
    var w = Math.max(2, (r.n / maxN) * 100);
    s += '<div class="drank-row" title="' + esc(r.name) + '"'
       + ' onmouseenter="ddeptTip(event,' + i + ')" onmousemove="gTipMove(event)" onmouseleave="gTipHide()">'
       + '<i class="ddbar" data-idx="' + i + '" style="background:' + col + '"></i>'
       + '<span class="dname">' + esc(shortName(r.name, 6)) + '</span>'
       + '<span class="dtrack"><i class="ddbar" data-idx="' + i + '"'
       + ' style="width:' + w.toFixed(1) + '%;background:' + col + '"></i></span>'
       + '<span class="dval">' + r.n + ' 条 · ' + r.pct.toFixed(1) + '%</span>'
       + '</div>';
  });
  // 先关 .drank，再关 .dstat-body，最后是 note 与 .dstat
  s += '</div></div>'
     + '<div class="dstat-note">柱长按需求条数等比绘制　鼠标悬停环形色段或柱条，可查看该部门名下的需求明细</div></div>';
  s += trendChartHtml(bd, tOff);

}
/* 占比趋势：按提出时间分桶的堆叠柱形（每个部门一段，柱高 = 该时段需求总数）。
   分段只画前 6 个部门 —— 18 个部门全画会碎成一片色块，看不出谁在起、谁在落。 */
function trendChartHtml(bd, tOff){
  var bks = bd.buckets;
  if(!bks.length) return '';
  var rg = bd.range || trendRange();
  // 区间说明：未筛选时强调「近 N 个月」，筛选后直接给出起止月，避免用户误以为趋势是全量数据
  var spanTxt = (rg.mode === 'recent' ? '近 ' + bks.length + ' 个月（' : '筛选区间 ')
              + rg.ya + ' ~ ' + rg.yb + (rg.mode === 'recent' ? '）' : '');
  var n = bks.length;
  // 标签密度自适应：月份多了就隔几个显示，否则文字会互相压叠（6 个月时 step=1，全部显示）
  var step = Math.max(1, Math.ceil(n / 12));
  var s = '<div class="dstat"><div class="dsub-hd">占比趋势 · 按自然月'
        + '<span class="muted">' + spanTxt + ' · 共 ' + n + ' 个月，峰值 ' + bd.maxB + ' 条'
        + (bd.outside ? '（另 ' + bd.outside + ' 条提出时间不在区间内）' : '') + '</span></div>'
        + '<div class="dtrend">'
        + '<div class="dtylab"><span>' + bd.maxB + '</span><span>0</span></div>'
        + '<div class="dtcols"><div class="dtplot">';
  bks.forEach(function(bk, i){
    // 整列都是热区：柱子最细只有几 px，不铺满整列几乎点不中
    s += '<div class="dtcolwrap"'
       + ' onmouseenter="ddeptTip(event,' + (tOff + i) + ')"'
       + ' onmousemove="gTipMove(event)"'
       + ' onmouseleave="gTipHide()">'
       // 底柱（.dtstack 的浅色底）：空月份也保留，时间轴不因某段无需求而断开
       + '<div class="dtstack">';
    bk.byDept.forEach(function(x){
      var h = (x.n / bd.maxB) * 100;
      s += '<i class="dtcol" data-idx="' + (tOff + i) + '"'
         + ' style="height:' + h.toFixed(1) + '%;background:' + STAT_COLORS[x.ci % STAT_COLORS.length] + '"></i>';
    });
    s += '</div>';
    // 数字贴柱顶：bottom 用该柱堆的实际高度百分比（相对柱区），矮柱的数字跟着下沉。
    // 放在 dtstack 之后输出——绝对定位不受 DOM 顺序影响，但这样空月份（0 条）直接不渲染。
    if(bk.items.length){
      var pc = bd.maxB ? (bk.items.length / bd.maxB) * 100 : 0;
      s += '<div class="dtnum" style="bottom:calc(' + pc.toFixed(1) + '% + 3px)">'
         + bk.items.length + '</div>';
    }
    s += '</div>';
  });
  s += '</div>';
  // 月份标签单独一行，与柱列同宽对齐：月份多时按 step 隔位显示，避免文字互相压叠
  s += '<div class="dtaxis">';
  bks.forEach(function(bk, i){
    s += '<div>' + (i % step === 0 ? esc(bk.label) : '') + '</div>';
  });
  s += '</div></div></div><div class="dlegend">';
  bd.seq.forEach(function(r, i){
    s += '<span class="dlg"><i style="background:' + STAT_COLORS[i % STAT_COLORS.length] + '"></i>'
       + esc(shortName(r.name, 8)) + '</span>';
  });
  s += '<span class="dlg"><i style="background:' + STAT_COLORS[9] + '"></i>其他部门</span>'
     + '<span class="muted">柱高 = 该月需求数，分段 = 各部门占比　默认近 ' + TREND_MONTHS
     + ' 个自然月，跟随「提出时间」筛选器</span>'
     + '</div></div>';
  return s;
}
/* 悬停卡：部门行列出该部门的需求；时间桶先按部门汇总占比，再列需求明细 */
function ddeptTipHtml(idx){
  var it = DDEPT_ROWS[idx];
  if(!it) return '';
  if(it.kind === 'dept'){
    var r = it.row;
    var h = '<div class="gt-h"><span style="font-weight:700;font-size:13.5px">' + esc(r.name) + '</span>'
          + '<span class="muted">' + r.n + ' 条 · 占 ' + r.pct.toFixed(1) + '%</span></div>';
    // 部门看板：副行补「提出人」（部门已在卡片标题里）
    return h + tipDemandList(r.items, 'person', 8);
  }
  var bk = it.bk;

/* ---------- 「每人手头项目数」条形图悬停明细 ----------
   2026-09-07 起该图自排名页移入项目总览页（#loadBox，关键指标之下）。

   withScore 为真的分支暂保留，未来要恢复综合分排行时可直接复用。
   交互与项目总览关键指标柱形图完全一致：整行热区（不用瞄准细条），
   复用 #gtip 浮层，命中行保持原色、其余淡出。
   注意：事件属性只能用全局 event，写 ev 会抛 ReferenceError 让悬停静默失效。 */
function rankTipHtml(name, ym, withScore){
  var r = computePeople(ym).filter(function(x){ return x.name === name; })[0];
  if(!r) return '';
  var mine = state.projects.filter(function(p){
    return p.owner === name || (p.members && p.members.indexOf(name) >= 0) || ((p.subOwners || []).indexOf(name) >= 0);
  });
  var inhand = mine.filter(function(p){ return !isDone(p); });
  // 名次与综合分同属一套口径：只给综合分排行图显示，在手项目数图里会让人误以为是按项目数排名
  var h = '<div class="gt-h"><span style="font-weight:700;font-size:13.5px">' + esc(name) + '</span>'
        + '<span class="muted">' + (withScore ? '第 ' + r.rank + ' 名 · ' : '')
        + '在手 ' + r.inhand + ' 个 · 主责 ' + r.owned + ' 个</span></div>';
  if(withScore){
    h += '<div class="gt-kv"><span class="gt-k">综合分</span><b>' + r.score + '</b>'
       + '<span class="gt-f">完成环节 ' + r.donePhases + '×10 ＋ 按期率 ' + r.rate + '%×30'
       + ' − 延期 ' + r.delayDays + ' 天×2 − 未更新 ' + r.stale + '×5</span></div>';
  }
  if(!inhand.length) return h + '<div class="gt-note">当前没有在手项目。</div>';
  h += '<div class="gt-list">';
  inhand.slice(0, 8).forEach(function(p){
    var late = isDelayed(p) ? '　<b style="color:#ff4d4f">延期 ' + dayDiff(p.planEnd, TODAY) + ' 天</b>' : '';
    h += '<div class="gt-li"><b>' + esc(p.name) + '</b>' + late + '</div>'
       + '<div class="gt-sub">' + (p.owner === name ? '主责' : '联合') + '　' + esc(p.status)
       + '　计划完成 ' + esc(p.planEnd || '—') + '</div>';
  });
  h += '</div>';
  if(inhand.length > 8) h += '<div class="gt-note">另有 ' + (inhand.length - 8) + ' 个未列出。</div>';
  return h;
}

/* 联合开发负责人：多选 chip。主责占掉的人不再出现在可选项里（避免同一个人既是主责又是联合），
   因此主责输入框 oninput 时会重渲染本区域。只改本弹窗内的 DOM，不触碰全局状态与 refreshAll 链。 */
function renderMemChips(){
  var box = document.getElementById('memPick'); if(!box) return;
  var ownerEl = document.getElementById('f_owner');
  var owner = (ownerEl && typeof ownerEl.value === 'string') ? ownerEl.value.trim() : '';
  var people = filterPeople();
  box.innerHTML = people.map(function(n){
    if(n === owner) return '<button type="button" class="pchip dis" title="此人已是主负责人">' + esc(n) + '（主责）</button>';
    var on = FORM_MEMS.indexOf(n) >= 0;
    return '<button type="button" class="pchip' + (on ? ' on' : '') + '" data-n="' + esc(n) + '" onclick="toggleMem(this.dataset.n)">' + esc(n) + '</button>';
  }).join('');
  var hint = document.getElementById('memHint');
  if(hint) hint.textContent = memHintText();
  var oh = document.getElementById('ownerHint');
  if(oh) oh.textContent = owner ? ('主责：' + owner + '，下方点选其他协作人') : '先填主负责人，下方再点选协作人';
}
function memHintText(){
  return FORM_MEMS.length
    ? ('已选 ' + FORM_MEMS.length + ' 人：' + FORM_MEMS.join('、'))
    : '未选择联合开发负责人（可不选；跨组协作的项目在这里点选多人）';
}
function toggleMem(n){
  var i = FORM_MEMS.indexOf(n);
  if(i >= 0) FORM_MEMS.splice(i, 1); else FORM_MEMS.push(n);
  // 只切换被点那一个 chip 的选中态，不整块重建：重建后后续点击拿到的是已被替换掉的旧 DOM，
  // 连续点选第二个人会出现「点了没反应」，同时还会丢 hover 态、让弹窗闪一下。
  // 取不到元素（如无 querySelector 的测试环境）时退回整块重建。
  var el = null;
  try{ el = document.querySelector ? document.querySelector('#memPick .pchip[data-n="' + n + '"]') : null; }catch(e){ el = null; }
  if(!el){ renderMemChips(); return; }
  el.className = 'pchip' + (FORM_MEMS.indexOf(n) >= 0 ? ' on' : '');
  var hint = document.getElementById('memHint');
  if(hint) hint.textContent = memHintText();
}
function renderSubChips(){
  var box = document.getElementById('subPick'); if(!box) return;
  var people = filterPeople();
  box.innerHTML = people.map(function(n){
    var on = FORM_SUBS.indexOf(n) >= 0;
    return '<button type="button" class="pchip' + (on ? ' on' : '') + '" onclick="toggleSub(\'' + esc(n) + '\')">' + esc(n) + '</button>';
  }).join('');
  var hint = document.getElementById('subHint');
  if(hint) hint.textContent = FORM_SUBS.length ? ('已选 ' + FORM_SUBS.length + ' 人：' + FORM_SUBS.join('、')) : '未选择次 IT 负责人（可不选）';
}
function toggleSub(n){
  var i = FORM_SUBS.indexOf(n);
  if(i >= 0) FORM_SUBS.splice(i, 1); else FORM_SUBS.push(n);
  renderSubChips();
}
function renderPhaseGrid(p){
  var plan = (p.phasePlan && p.phasePlan.length) ? p.phasePlan : autoPhasePlan(p.planStart, p.planEnd);
  var h = '';
  PHASES.forEach(function(k, i){
    var it = plan[i] || { k:k, s:'', e:'' };
    h += '<div class="pgrow"><span class="pn">' + k + '</span>'
      + '<input type="date" id="pp_s_' + i + '" value="' + esc(it.s || '') + '">'
      + '<input type="date" id="pp_e_' + i + '" value="' + esc(it.e || '') + '"></div>';
  });
  var g = document.getElementById('phaseGrid');
  if(g) g.innerHTML = h;
}
function phaseHint(v){
  var el = document.getElementById('phaseHint');
  if(el) el.textContent = PHASE_DESC[v] || '';
}
function autoFillPhases(){
  var s = document.getElementById('f_ps').value;
  var e = document.getElementById('f_pe').value;
  var plan = autoPhasePlan(s, e);
  PHASES.forEach(function(k, i){
    var a = document.getElementById('pp_s_' + i), b = document.getElementById('pp_e_' + i);
    if(a) a.value = plan[i].s || '';
    if(b) b.value = plan[i].e || '';
  });
}
function saveProject(rid){
  var name = document.getElementById('f_name').value.trim();
  if(!name){ alert('请填写项目名称'); return; }
  var plan = [];
  PHASES.forEach(function(k, i){
    plan.push({
      k:k,
      s: (document.getElementById('pp_s_' + i) || {}).value || '',
      e: (document.getElementById('pp_e_' + i) || {}).value || ''
    });
  });
  var old = rid ? findProject(rid) : null;
  var real = (old && old.phaseReal && old.phaseReal.length) ? normPhaseReal(old)
           : PHASES.map(function(k, i){
               return { k:k, st: (i === 0 ? '进行中' : '未开始'), p:0, e:'' };
             });
  var phase = document.getElementById('f_phase').value;
  var prog = Math.max(0, Math.min(100, num(document.getElementById('f_prog').value)));
  // 同步当前环节的实际状态
  for(var i=0;i<real.length;i++){
    if(real[i].k === phase){
      real[i].st = (prog >= 100) ? '已完成' : '进行中';
      real[i].p = prog;
      if(prog >= 100) real[i].e = TODAY;
    }
  }
  var p = {
    rid: rid,
    name: name,
    code: document.getElementById('f_code').value.trim(),
    requester: document.getElementById('f_req').value.trim(),
    dept: document.getElementById('f_dept').value.trim(),
    owner: document.getElementById('f_owner').value.trim(),
    members: FORM_MEMS.slice(),
    subOwners: FORM_SUBS.slice(),
    priority: document.getElementById('f_prio').value,
    status: document.getElementById('f_status').value,
    phase: phase,
    progress: prog,
    planStart: document.getElementById('f_ps').value,
    planEnd: document.getElementById('f_pe').value,
    actualEnd: document.getElementById('f_ae').value,
    lastUpdate: TODAY,
    phasePlan: plan,
    phaseReal: real,
    note: document.getElementById('f_note').value.trim(),
    demo: old ? old.demo : false
  };
  upsertProject(p, !rid);
  syncDemandDoneAt();   // 项目状态可能刚改成「已完成」→ 回填同名需求的实际完成时间
  closeModal();
  refreshAll();
}

function saveProgress(rid){
  var p = findProject(rid);
  if(!p) return;
  var filler = document.getElementById('g_filler').value.trim();
  var work = document.getElementById('g_work').value.trim();
  var phase = document.getElementById('g_phase').value;
  var st = document.getElementById('g_st').value;
  var prog = Math.max(0, Math.min(100, num(document.getElementById('g_prog').value)));
  if(!filler){ alert('请填写填报人'); return; }
  if(!work){ alert('请填写本日进展'); return; }
  state.filler = filler; lsSet(LK.filler, filler);

  addLog({
    date: document.getElementById('g_date').value || TODAY,
    pid: rid, pname: p.name, filler: filler, phase: phase, st: st, prog: prog,
    work: work, blocker: document.getElementById('g_block').value.trim(),
    needHelp: document.getElementById('g_help').checked, demo: false
  });

  // 回写项目主记录
  var real = normPhaseReal(p);
  for(var i=0;i<real.length;i++){
    if(real[i].k === phase){
      real[i].st = st; real[i].p = prog;
      real[i].e = (st === '已完成') ? (document.getElementById('g_date').value || TODAY) : '';
    }
  }
  var np = {
    rid: p.rid, name: p.name, code: p.code, requester: p.requester, dept: p.dept,
    owner: p.owner, members: p.members, subOwners: p.subOwners || [], priority: p.priority,
    status: p.status, phase: phase, progress: p.progress,
    planStart: p.planStart, planEnd: p.planEnd, actualEnd: p.actualEnd,
    lastUpdate: TODAY, phasePlan: p.phasePlan, phaseReal: real, note: p.note, demo: p.demo
  };
  var psEl = document.getElementById('g_pstatus');
  var ppEl = document.getElementById('g_pprog');
  if(psEl) np.status = psEl.value;
  if(ppEl) np.progress = Math.max(0, Math.min(100, num(ppEl.value)));
  if(np.status === '已完成' && !np.actualEnd) np.actualEnd = TODAY;
  if(np.status === '已完成') np.progress = 100;
  if(st === '阻塞' && np.status !== '已完成') np.status = '已阻塞';
  upsertProject(np, false);
  syncDemandDoneAt();   // 填报可能把项目状态推到「已完成」→ 回填同名需求的实际完成时间

  closeModal();
  refreshAll();
}

    + '<div class="frow"><label>优先级建议</label><select id="d_prio" onchange="state.draft.prio=this.value">' + opts(PRIOS, d.prio) + '</select></div>'
    + '</div>'
