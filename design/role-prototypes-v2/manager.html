/* 附件区：三层通道 —— 图片走 CDN(≤10MB) / 小文档内嵌(≤1MB) / 超限与视频走外链或对话代传 */
function attIcon(m){
  var a = 'width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  if(m === 'image') return '<svg ' + a + ' stroke="#5d87ff"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
  if(m === 'video') return '<svg ' + a + ' stroke="#7c3aed"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>';
  if(m === 'audio') return '<svg ' + a + ' stroke="#0891b2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
  return '<svg ' + a + ' stroke="#64748b"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
}
function buildAttZone(){
  var h = '<div class="frow"><label>附件（可选）</label><div class="attzone">'
    + '<div class="attbtns">'
    + '<label class="btn sm ghost attpick" for="att_file">选择文件</label>'
    + '<input id="att_file" class="attfile" type="file" multiple accept="' + ATT_ACCEPT + '" onchange="pickAttFiles(this)">'
    + '<button type="button" class="btn sm ghost" onclick="toggleAttLink()">' + (state.attLinkOpen ? '收起链接' : '粘贴链接') + '</button>'
    + '</div>';
  if(state.attLinkOpen){
    h += '<div class="attlink">'
      + '<input id="att_lname" placeholder="文件名，如：现场操作录屏.mp4" value="' + esc(state.attLinkName) + '" oninput="state.attLinkName=this.value">'
      + '<input id="att_lurl" placeholder="网盘 / 视频链接，需以 https:// 开头" value="' + esc(state.attLinkUrl) + '" oninput="state.attLinkUrl=this.value">'
      + '<button type="button" class="btn sm" onclick="addAttLink()">添加</button>'
      + '</div>';
  }
  h += '<div class="atthint">图片 ≤10MB 直传云端；Word / PPT / PDF / MD ≤' + (ATT_MAX/1048576) + 'MB 可直接上传；'
     + '更大的文件与视频请点「粘贴链接」，或在对话里把文件发给管理员代为上传。</div>';
  if(state.pickAtts.length){
    h += '<div class="attlist">';
    state.pickAtts.forEach(function(a, i){
      h += '<div class="attitem">' + attIcon(a.media)
        + '<span class="attname">' + esc(a.name) + '</span>'
        + '<span class="attsize">' + fmtSize(a.size) + '</span>'
        + '<button type="button" class="attdel" title="移除" onclick="dropPickAtt(' + i + ')">'
        + '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
        + '</button></div>';
    });
    h += '</div>';
  }
  h += '</div></div>';
  return h;
}
function toggleAttLink(){ state.attLinkOpen = !state.attLinkOpen; refreshDemandModal(); }
function dropPickAtt(i){ state.pickAtts.splice(i, 1); refreshDemandModal(); }
function addAttLink(){
  var name = (state.attLinkName || '').trim();
  var url = (state.attLinkUrl || '').trim();
  if(!url){ alert('请填写链接地址'); return; }
  if(!/^https?:\/\//i.test(url)){ alert('链接需以 http:// 或 https:// 开头'); return; }
  state.pickAtts.push({ name: name || url, size: 0, type: 'text/uri-list',
    media: mediaOf(name || url, ''), data: '', url: url, rid: '', kind: 'link' });
  state.attLinkName = ''; state.attLinkUrl = ''; state.attLinkOpen = false;
  refreshDemandModal();
}
function pickAttFiles(input){
  var fs = input.files || [];
  var big = [], ok = [];
  for(var i=0;i<fs.length;i++){
    var f = fs[i];
    var lim = isImageFile(f.name, f.type) ? 10 * 1048576 : ATT_MAX;
    if(f.size > lim) big.push(f.name + '（' + fmtSize(f.size) + '）');
    else ok.push(f);
  }
  input.value = '';
  if(!ok.length){
    if(big.length){
      alert('以下文件超出上传上限，未加入：\n\n' + big.join('\n')
        + '\n\n图片上限 10MB；Word / PPT / PDF / MD 上限 ' + (ATT_MAX/1048576) + 'MB。'
        + '\n更大的文件与视频请点「粘贴链接」，或在对话里把文件发给管理员代为上传。');
      refreshDemandModal();
    }
    return;
  }
  var left = ok.length;
  ok.forEach(function(f){
    var fr = new FileReader();
    fr.onload = function(){
      var raw = String(fr.result || '');
      var pos = raw.indexOf(',');
      state.pickAtts.push({
        name: f.name, size: f.size, type: f.type || 'application/octet-stream',
        media: mediaOf(f.name, f.type),
        data: pos >= 0 ? raw.slice(pos + 1) : raw,   // 去掉 data:...;base64, 前缀
        url: '', rid: '',
        kind: isImageFile(f.name, f.type) ? 'image' : 'doc'
      });
      if(--left <= 0) afterPickFiles(big);
    };
    fr.onerror = function(){ if(--left <= 0) afterPickFiles(big); };
    fr.readAsDataURL(f);
  });
}
function afterPickFiles(big){
  if(big && big.length){
    alert('以下文件超出上传上限，未加入：\n\n' + big.join('\n')
      + '\n\n图片上限 10MB；Word / PPT / PDF / MD 上限 ' + (ATT_MAX/1048576) + 'MB。'
      + '\n更大的文件与视频请点「粘贴链接」，或在对话里把文件发给管理员代为上传。');
  }
  refreshDemandModal();
}
function saveDemand(){
  var d0 = state.draft;
  var t = (d0.title || '').trim();
  var person = (d0.person || '').trim();
  var dept = (d0.dept || '').trim();
  var desc = (d0.desc || '').trim();
  if(!t){ alert('请填写需求名称'); return; }
  if(!person){ alert('请选择提出人'); return; }
  if(!dept){ alert('请填写需求部门'); return; }
  if(!desc){ alert('请填写需求描述'); return; }
  var picks = state.pickAtts.slice();
  var nd = {
    title: t, dept: dept, person: person, expect: d0.expect || '', doneAt: '',
    desc: desc, prio: d0.prio || 'P1', status: '待评估', owner: '',
    ctime: nowStamp(), atts: [], demo: false
  };
  closeModal();
  // 附件必须等需求记录建好、拿到真实 rid 后才能关联上传
  upsertDemand(nd, true).then(function(rid){
    if(picks.length) return uploadPickedAtts(rid, picks);
    return null;
  }).then(function(){
    refreshAll();
  });
}
/* ---------------- 附件：上传 / 汇总 / 下载 ---------------- */
function findDemandByRid(rid){
  for(var i=0;i<state.demands.length;i++) if(state.demands[i].rid === rid) return state.demands[i];
  return null;
}
function attsOf(pid){
  return state.atts.filter(function(a){ return a.pid === pid; });
}
/* 把某需求的附件清单（来自 state.atts）写回需求记录的「附件」摘要字段。
   摘要只含元数据，不含 base64，因此需求列表加载不会被附件体积拖慢。 */
function writeAttSummary(pid){
  var d = findDemandByRid(pid);
  if(!d) return Promise.resolve();
  d.atts = attsOf(pid).map(function(a){
    return { name:a.name, size:a.size, type:a.type, media:a.media, url:a.url, rid:a.rid };
  });
  saveLocal();
  if(state.cloudOK){
    return cloudUpdate('demands', pid, { '附件':{ text: attSummaryOf(d) } })
      .then(function(){ setSync('online'); }).catch(function(){});
  }
  return Promise.resolve();
}
function saveAttDoc(pid, a){
  var rec = { rid:'', pid:pid, name:a.name, size:a.size, type:a.type, media:a.media,
              data:a.data, url:'', ctime:nowStamp(), demo:false };
  if(!state.cloudOK){
    // 离线：先落本地缓存，联网后由 flushAtts 补传
    state.atts.push(rec);
    saveLocal();
    return Promise.resolve(rec);
  }
  return cloudAdd('att', attProps(rec, pid)).then(function(res){
    rec.rid = newId(res);
    state.atts.push(rec);
    saveLocal();
    return rec;
  }).catch(function(){
    state.atts.push(rec);   // 上传失败也留一份本地，避免文件直接丢失
    saveLocal();
    return rec;
  });
}
function uploadPickedAtts(pid, list){
  var jobs = list.map(function(a){
    if(a.kind === 'link'){
      state.atts.push({ rid:'', pid:pid, name:a.name, size:0, type:a.type, media:a.media,
                        data:'', url:a.url, ctime:nowStamp(), demo:false });
      return Promise.resolve();
    }
    if(a.kind === 'image'){
      return cloudUploadImage(a.data, a.type, a.name).then(function(url){
        if(url){
          state.atts.push({ rid:'', pid:pid, name:a.name, size:a.size, type:a.type,
                            media:a.media, data:'', url:url, ctime:nowStamp(), demo:false });
          return;
        }
        // CDN 失败且体积允许时，降级为内嵌文档
        if(a.size <= ATT_MAX) return saveAttDoc(pid, a);
        return null;
      }).catch(function(){
        if(a.size <= ATT_MAX) return saveAttDoc(pid, a);
        return null;
      });
    }
    return saveAttDoc(pid, a);
  });
  return Promise.all(jobs).then(function(){ return writeAttSummary(pid); });
}
/* 联网后补传离线期间暂存的附件 */
function flushAtts(){
  var todo = state.atts.filter(function(a){ return !a.rid && a.data; });
  if(!todo.length || !state.cloudOK) return Promise.resolve();
  var chain = Promise.resolve();
  todo.forEach(function(a){
    chain = chain.then(function(){
      return cloudAdd('att', attProps(a, a.pid))
        .then(function(res){ var nid = newId(res); if(nid) a.rid = nid; })
        .catch(function(){});
    });
  });
  return chain.then(function(){
    saveLocal();
    var pids = uniq(todo.map(function(a){ return a.pid; }));
    var c2 = Promise.resolve();
    pids.forEach(function(pid){
      c2 = c2.then(function(){ return writeAttSummary(pid); });
    });
    return c2;
  });
}
/* 打开附件：外链直接新窗口；否则先在本机缓存找 base64，没有再按 rid 从附件表按需拉取，
   拿到数据后交给 previewAtt 决定「预览还是下载」 */
function openAtt(drid, idx){
  var d = findDemandByRid(drid);
  if(!d || !d.atts || !d.atts[idx]) return;
  var s = d.atts[idx];
  if(s.url){ window.open(s.url, '_blank'); return; }
  var local = null;
  for(var i=0;i<state.atts.length;i++){
    if(state.atts[i].name === s.name && state.atts[i].pid === drid && state.atts[i].data){
      local = state.atts[i]; break;
    }
  }
  function got(data){
    if(!data){ alert('附件数据不在本机，且无法从云端读取，请检查网络后重试。'); return; }
    previewAtt(s, data);
  }
  if(local && local.data){ got(local.data); return; }
  if(!s.rid){ alert('该附件尚未同步到云端，请联网后重试。'); return; }
  loadAttsOf(drid).then(function(arr){
    var hit = arr.filter(function(x){ return x.rid === s.rid; })[0];
    got(hit ? hit.data : '');
  });
}
/* 附件预览：图片直接看图、文本直接读、PDF 交给浏览器内置阅读器，其余类型才落到下载。
   2026-09-06 用户要求「能看到上传了哪些文件，并支持点击阅读」——只给下载不满足需求。 */
var TEXT_EXT = ['txt','md','markdown','csv','log','json','xml','yml','yaml','ini','sql','html','htm'];
function attIsText(s){
  var t = String(s.type || '').toLowerCase();
  if(t.indexOf('text/') === 0) return true;
  if(['application/json','application/xml','application/javascript'].indexOf(t) >= 0) return true;
  var ext = String(s.name || '').split('.').pop().toLowerCase();
  return TEXT_EXT.indexOf(ext) >= 0;
}
function attIsPdf(s){
  if(String(s.type || '').toLowerCase() === 'application/pdf') return true;
  return /\.pdf$/.test(String(s.name || '').toLowerCase());
}
/* base64 → 文本：b64enc 用的是 UTF-8 安全编码，解码必须走 escape/decodeURIComponent 配对 */
function b64utf8(data){
  try { return decodeURIComponent(escape(atob(data))); } catch(e){ return ''; }
}
function attBlob(s, data){
  var bin = atob(data);
  var buf = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
  return new Blob([buf], { type: s.type || 'application/octet-stream' });
}
function attDownload(s, data){
  if(!data) return;
  var url = URL.createObjectURL(attBlob(s, data));
  var el = document.createElement('a');
  el.href = url; el.download = s.name || '附件';
  document.body.appendChild(el); el.click();
  document.body.removeChild(el);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
}
/* 预览弹窗底部：关闭 + 下载。下载走 data URL，不用缓存 base64，避免弹窗关掉后仍占内存 */
function attViewFooter(s, data){
  return '<div class="mact"><button class="btn ghost" onclick="closeModal()">关闭</button>'
       + '<a class="btn" style="text-decoration:none;display:flex;align-items:center;justify-content:center"'
       + ' href="data:' + (s.type || 'application/octet-stream') + ';base64,' + data + '"'
       + ' download="' + esc(s.name || '附件') + '">下载</a></div>';
}
function previewAtt(s, data){
  var name = s.name || '附件';
  if(!data){ alert('附件内容为空，可能上传中断，请重新上传。'); return; }
  if(isImageFile(s.name, s.type)){
    showModal('附件预览 · ' + name,
      '<div class="attprev"><img class="attprev-img" alt="' + esc(name) + '"'
      + ' src="data:' + (s.type || 'image/png') + ';base64,' + data + '"></div>'
      + attViewFooter(s, data));
    return;
  }
  if(attIsPdf(s)){
    // 浏览器自带 PDF 阅读器：新标签页打开 Blob，比下载后再找文件快得多。
    // 延迟回收，立即 revoke 会让刚打开的标签页读不到数据。
    var u = URL.createObjectURL(attBlob(s, data));
    window.open(u, '_blank');
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
    return;
  }
  if(attIsText(s)){
    var txt = b64utf8(data);
    if(!txt){ attDownload(s, data); return; }   // 非 UTF-8 文本（如 GBK 编码文件）读出来是乱码，退回下载
    if(txt.length > 200000) txt = txt.slice(0, 200000) + '\n\n… 内容过长已截断，点「下载」查看完整文件';
    showModal('附件预览 · ' + name,
      '<div class="attprev-note">' + esc(name) + '　' + fmtSize(s.size || data.length) + '</div>'
      + '<div class="attprev"><pre class="attprev-txt">' + esc(txt) + '</pre></div>'
      + attViewFooter(s, data));
    return;
  }
  attDownload(s, data);   // Office / 压缩包等浏览器打不开的类型，只能下载
}
/* 表格「附件」列：默认最多显示 2 个，其余收进「+N 个」弹窗。
   不设限的话，一条需求挂 5 个附件会把整行撑成三倍高，表格没法扫读。 */
var ATT_CELL_MAX = 2;
function attChipHtml(d, a, i){
  return '<button type="button" class="attchip" onclick="openAtt(\'' + d.rid + '\',' + i + ')"'
       + ' title="点击查看 / 下载：' + esc(a.name) + '">'
       + attIcon(a.media) + '<span>' + esc(a.name) + '</span>'
       + (a.size ? '<em>' + fmtSize(a.size) + '</em>' : '')
       + '</button>';
}
function attCellFor(d){
  var list = d.atts || [];
  if(!list.length) return '<span class="muted">—</span>';
  var h = '<div class="attchips">';
  list.slice(0, ATT_CELL_MAX).forEach(function(a, i){ h += attChipHtml(d, a, i); });
  h += '</div>';
  if(list.length > ATT_CELL_MAX){
    h += '<button type="button" class="attmore" onclick="openAttList(\'' + d.rid + '\')">+'
       + (list.length - ATT_CELL_MAX) + ' 个</button>';
  }
  return h;
}
function openAttList(rid){
  var d = findDemandByRid(rid);
  if(!d || !d.atts || !d.atts.length) return;
  showModal('附件 · ' + d.title,
      '<div class="attprev-note">共 ' + d.atts.length + ' 个附件，点击即可查看 / 下载</div>'
    + '<div class="attlist-modal">' + d.atts.map(function(a, i){ return attChipHtml(d, a, i); }).join('') + '</div>'
    + '<div class="mact"><button class="btn ghost" onclick="closeModal()">关闭</button></div>');
}
/* 需求的「实际完成时间」唯一来源 = 关联项目验收（2026-09-06 用户口径）：
   ① 需求池不开放手工填写，也不再因「已立项 / 已驳回」而回填今天
   ② 只有同名项目（转立项时 project.name = demand.title）状态变为「已完成」才算验收
   ③ 取项目的「实际完成」日期；项目没填实际完成日则退回项目的最后更新日期
   ④ 项目未完成 / 找不到关联项目 / 需求被驳回 → 一律留空，时间差距与标签显示「—」
   历史脏值（旧版本自动填的立项当天）会在这一步被清掉，保证列里没有非法来源的值。 */
function linkedProjectOf(d){
  for(var i=0;i<state.projects.length;i++){
    if(state.projects[i].name === d.title) return state.projects[i];
  }
  return null;
}
function demandDoneAtOf(d){
  var p = linkedProjectOf(d);
  if(!p || p.status !== '已完成') return '';
  return p.actualEnd || p.lastUpdate || '';
}
/* 反向关联：项目 → 需求（同名匹配，与 linkedProjectOf 同一套口径）。
   项目卡片上的「提交时间 / 期望完成」来自需求池对应记录：ctime 取日期部分，expect 原样。
   手工新建的项目（没走过需求池）找不到同名需求 → 两个字段显示 —。 */
function linkedDemandOf(p){
  for(var i=0;i<state.demands.length;i++){
    if(state.demands[i].title === p.name) return state.demands[i];
  }
  return null;
}
/* 把上述口径落到 state.demands，返回被改动的条数。只写有差异的，避免每次刷新都推云端。 */
function syncDemandDoneAt(){
  var n = 0;
  state.demands.forEach(function(d){
    var want = demandDoneAtOf(d);
    if(d.doneAt === want) return;
    d.doneAt = want;
    n++;
    upsertDemand(d, false);
  });
  return n;
}
function openDemandAssign(rid){
  var d = null;
  for(var i=0;i<state.demands.length;i++) if(state.demands[i].rid === rid) d = state.demands[i];
  if(!d) return;
  // 2026-09-07 起「承接 IT 负责人」支持多选 chip；历史单值/顿号串都由 splitNames 归一回显
  FORM_DOWNS = splitNames(d.owner);
  var body = ''
    + '<div class="hintbox">' + esc(d.desc) + '</div>'
    + '<div class="pc-meta" style="grid-template-columns:1fr 1fr;font-size:13.5px;margin-bottom:14px">'
    + '<div>提出人：<b>' + esc(d.person) + '</b></div><div>部门：<b>' + esc(d.dept) + '</b></div>'
    + '<div>期望完成：<b>' + esc(d.expect || '—') + '</b></div><div>提出时间：<b>' + esc(d.ctime || '—') + '</b></div>'
    + '<div>实际完成：<b>' + esc(d.doneAt || '—') + '</b></div><div></div></div>'
    + '<div class="f2">'
    + '<div class="frow"><label>处理结果</label><select id="a_status">' + opts(DSTATUS, d.status) + '</select></div>'
    + '<div class="frow"><label>优先级</label><select id="a_prio">' + opts(PRIOS, d.prio) + '</select></div>'
    + '</div>'
    // 2026-09-06 用户口径：实际完成时间不开放手工填写，唯一来源是关联项目验收（见 syncDemandDoneAt）

/* 承接 IT 负责人：多选 chip（2026-09-07）。与项目弹窗的 memPick 同款交互：
   点击只切换被点 chip 的选中态（不整块重建），避免连续点选失效与 hover 丢失。 */
function renderDownChips(){
  var box = document.getElementById('downPick'); if(!box) return;
  var people = filterPeople();
  box.innerHTML = people.map(function(n){
    var on = FORM_DOWNS.indexOf(n) >= 0;
    return '<button type="button" class="pchip' + (on ? ' on' : '') + '" data-n="' + esc(n) + '" onclick="toggleDown(this.dataset.n)">' + esc(n) + '</button>';
  }).join('');
  var hint = document.getElementById('downHint');
  if(hint) hint.textContent = FORM_DOWNS.length
    ? ('已选 ' + FORM_DOWNS.length + ' 人：' + FORM_DOWNS.join('、') + '；转立项时第 1 人为主责，其余为联合开发')
    : '点选承接本需求的 IT 负责人（可多选）';
}
function toggleDown(n){
  var i = FORM_DOWNS.indexOf(n);
  if(i >= 0) FORM_DOWNS.splice(i, 1); else FORM_DOWNS.push(n);
  var el = null;
  try{ el = document.querySelector ? document.querySelector('#downPick .pchip[data-n="' + n + '"]') : null; }catch(e){ el = null; }
  if(!el){ renderDownChips(); return; }
  el.className = 'pchip' + (FORM_DOWNS.indexOf(n) >= 0 ? ' on' : '');
  var hint = document.getElementById('downHint');
  if(hint) hint.textContent = FORM_DOWNS.length
    ? ('已选 ' + FORM_DOWNS.length + ' 人：' + FORM_DOWNS.join('、') + '；转立项时第 1 人为主责，其余为联合开发')
    : '点选承接本需求的 IT 负责人（可多选）';
}
function saveDemandAssign(rid){
  var d = null, idx = -1;
  for(var i=0;i<state.demands.length;i++) if(state.demands[i].rid === rid){ d = state.demands[i]; idx = i; }
  if(!d) return;
  var status = document.getElementById('a_status').value;
  var prio = document.getElementById('a_prio').value;
  var toProj = document.getElementById('a_toproj') && document.getElementById('a_toproj').checked;
  // 多承接人以「、」连接存储（云端「承接人」仍是单文本列，历史数据由 splitNames 归一）
  var owner = FORM_DOWNS.join('、');
  // doneAt 不在本弹窗写入（2026-09-06 用户口径）：唯一来源是关联项目验收，见 syncDemandDoneAt
  d.status = status; d.owner = owner; d.prio = prio;
  upsertDemand(d, false);
  if(status === '已立项' && toProj){
    var ps = TODAY, pe = d.expect || addDays(TODAY, 30);
    // 第 1 个承接人 = 项目主责，其余进「联合开发」，保证排名统计按花名册人名正常匹配
    upsertProject({
      name: d.title, code: '', requester: d.person, dept: d.dept, owner: FORM_DOWNS[0] || '', members: FORM_DOWNS.slice(1), subOwners: [],
      priority: prio, status: '未开始', phase: PHASES[0], progress: 0,
      planStart: ps, planEnd: pe, actualEnd: '', lastUpdate: TODAY,
      phasePlan: autoPhasePlan(ps, pe),
      phaseReal: PHASES.map(function(k, i2){ return { k:k, st: i2 === 0 ? '进行中' : '未开始', p:0, e:'' }; }),
      note: '由需求池「' + d.title + '」转立项', demo: false
    }, true);
  }
  closeModal();
  syncDemandDoneAt();   // 项目名称 = 需求标题，从这里开始两者的完成时间就绑定了
  refreshAll();
}
function clearDemo(){
  var n = state.projects.filter(function(p){ return p.demo; }).length
        + state.logs.filter(function(l){ return l.demo; }).length
        + state.demands.filter(function(d){ return d.demo; }).length;
  if(!n){ alert('没有示例数据'); return; }
  if(!confirm('将删除 ' + n + ' 条示例数据，你自己录入的数据不受影响。确认继续？')) return;
  state.projects.filter(function(p){ return p.demo; }).forEach(function(p){
    removeProject(p.rid);
  });
  state.demands.filter(function(d){ return d.demo; }).forEach(function(d){
    state.demands = state.demands.filter(function(x){ return x.rid !== d.rid; });
    if(state.cloudOK) cloudDelete('demands', d.rid).catch(function(){});
  });
  state.logs = state.logs.filter(function(l){
    if(!l.demo) return true;
    if(state.cloudOK) cloudDelete('progress', l.rid).catch(function(){});
    return false;
  });
  // 示例附件一并清理，避免附件表里留下孤儿数据
  state.atts.filter(function(a){ return a.demo; }).forEach(function(a){
    if(a.rid && state.cloudOK) cloudDelete('att', a.rid).catch(function(){});
  });
  state.atts = state.atts.filter(function(a){ return !a.demo; });
  saveLocal();
  refreshAll();
}

/* ---------------- 备份 ---------------- */
function exportJSON(){
  var data = { app:'aiit-workspace', version:2, exportedAt:new Date().toISOString(),
               projects:state.projects, logs:state.logs, demands:state.demands, atts:state.atts };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'AIIT工作台备份_' + TODAY + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 200);
}
function importJSON(input){
  var f = input.files && input.files[0];
  if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try {
      var d = JSON.parse(rd.result);
      if(!d || (!d.projects && !d.logs && !d.demands)) throw new Error('格式不符');
      var n = (d.projects || []).length + (d.logs || []).length + (d.demands || []).length;
      if(!confirm('将导入 ' + n + ' 条数据覆盖当前页面数据（不限条数），确认继续？')) return;
      state.projects = d.projects || [];
      state.logs = d.logs || [];
      state.demands = d.demands || [];
      state.atts = d.atts || [];
      saveLocal();
      syncDemandDoneAt();   // 导入的是旧口径数据（可能带手工填的实际完成时间），按新口径重算一遍
      refreshAll();
      alert('已导入 ' + n + ' 条数据');
    } catch(e){ alert('导入失败：文件格式不正确'); }
    input.value = '';
  };
  rd.readAsText(f, 'utf-8');
}

/* 演示数据换人：历史示例里用的是虚构姓名（非花名册成员），检测后整组重建。
   只动 demo:true 的记录——用户自建数据（demo:false）一行不碰。
   云端存在时同步删除旧示例，否则下次拉库又会被覆盖回旧姓名。 */
function demoHasStranger(){
  var bad = false;
  /* 版本戳优先：示例数据改版（换人 / 换部门 / 增删条数）后，旧示例 dv 不符即整组重建。
     只靠姓名比对不够——旧版示例可能人数、部门、条数都变了但姓名恰好对得上。 */
  [].concat(state.projects, state.logs, state.demands, state.atts).forEach(function(r){
    if(r && r.demo && r.dv !== DEMO_VER) bad = true;
  });
  state.projects.forEach(function(p){
    if(!p.demo) return;
    [p.owner].concat(p.members || []).forEach(function(n){ if(n && TEAM.indexOf(n) < 0) bad = true; });
  });
  state.logs.forEach(function(l){
    if(l.demo && l.filler && TEAM.indexOf(l.filler) < 0) bad = true;
  });
  state.demands.forEach(function(d){
    // 承接人允许多人（顿号串），逐个校验，避免多人串被整体误判为「外来名」触发示例重建
    if(d.demo && d.owner) splitNames(d.owner).forEach(function(n){ if(TEAM.indexOf(n) < 0) bad = true; });
    // 示例部门必须是组织架构里的真实部门（旧示例用市场部/生产部等虚构部门）
    if(d.demo && d.dept && DEPTS.indexOf(d.dept) < 0) bad = true;
  });
  state.projects.forEach(function(p){
    if(p.demo && p.dept && DEPTS.indexOf(p.dept) < 0) bad = true;
  });
  // 示例条数不足（如旧版只有 2 条需求）也要重建，否则用户看不到新增的示例
  if(state.demands.filter(function(d){ return d.demo; }).length < 10) bad = true;
  return bad;
}
function refreshDemoTeam(){
  if(!demoHasStranger()) return false;
  state.projects.filter(function(p){ return p.demo; }).forEach(function(p){
    state.projects = state.projects.filter(function(x){ return x.rid !== p.rid; });
    if(state.cloudOK) cloudDelete('projects', p.rid).catch(function(){});
  });
  state.demands.filter(function(d){ return d.demo; }).forEach(function(d){
    state.demands = state.demands.filter(function(x){ return x.rid !== d.rid; });
    if(state.cloudOK) cloudDelete('demands', d.rid).catch(function(){});
  });
  state.logs.filter(function(l){ return l.demo; }).forEach(function(l){
    if(state.cloudOK) cloudDelete('progress', l.rid).catch(function(){});
  });
  state.logs = state.logs.filter(function(l){ return !l.demo; });
  state.atts.filter(function(a){ return a.demo; }).forEach(function(a){
    if(a.rid && state.cloudOK) cloudDelete('att', a.rid).catch(function(){});
  });
  state.atts = state.atts.filter(function(a){ return !a.demo; });
  saveLocal();
  seedData(true);
  return true;
}

function boot(force){
  setSync('syncing');
  var db = sdk();
  if(!db){
    state.cloudOK = false;
    state.projects = lsGet(LK.projects, []);
    state.logs = lsGet(LK.logs, []);
    state.demands = lsGet(LK.demands, []);
    state.atts = lsGet(LK.atts, []);
    seedData();
    syncDemandDoneAt();   // 离线首帧也要把需求的实际完成时间对齐到项目验收状态
    setSync('offline');
    refreshAll();
    return;
  }
  // 注意：附件表不在这里整表加载。它存的是 base64，全量拉取会拖垮启动，
  // 只在用户点开某个附件时由 loadAttsOf() 按需查询。
  Promise.all([cloudLoadAll('projects'), cloudLoadAll('progress'), cloudLoadAll('demands')])
    .then(function(r){
      state.cloudOK = true;
      state.projects = r[0].map(normProject);
      state.logs = r[1].map(normLog);
      state.demands = r[2].map(normDemand);
      state.atts = lsGet(LK.atts, []);   // 本地只留离线待传的附件
      saveLocal();
      if(!state.projects.length && !state.logs.length && !state.demands.length) seedData();
      refreshDemoTeam();   // 旧版示例含虚构姓名 → 重建为花名册成员
      return flushPending();
    })
    .then(function(){
      return flushAtts();  // 补传离线期间暂存到本地的附件
    })
    .then(function(){
      syncDemandDoneAt();   // 云端数据到齐后再对齐一次（项目可能在别的设备上刚被验收）
      setSync(state.pending.length ? 'offline' : 'online');
      refreshAll();
    })
    .catch(function(){
      state.cloudOK = false;
      state.projects = lsGet(LK.projects, []);
      state.logs = lsGet(LK.logs, []);
      state.demands = lsGet(LK.demands, []);
      state.atts = lsGet(LK.atts, []);
      seedData();
      refreshDemoTeam();   // 离线缓存里的旧示例同样需要换人
      syncDemandDoneAt();
      setSync('offline');
      refreshAll();
    });
}

renderToday=function(){ART_RAW.renderToday();if(ART_ROLE!=='manager'){var create=document.querySelector('#todaySec button[onclick^="openProjectModal"]');if(create)create.remove();}if(ART_ROLE==='business'){var heading=document.querySelector('#todaySec h2');if(heading)heading.textContent='待我补充';}};
renderDemands=function(){var selected=artDemands();artWithin(state.projects,selected,function(){ART_RAW.renderDemands();});
  if(ART_ROLE==='business'&&ART_SCOPE==='mine'){var p=state.projects.filter(function(x){return x.requester===ART_USER;}),parts=[['我提交的需求',selected.length],['待评估',selected.filter(function(x){return x.status==='待评估';}).length],['推进中',p.filter(function(x){return !isDone(x);}).length],['已交付',p.filter(function(x){return x.status==='已完成';}).length]];document.getElementById('pane-demand').insertAdjacentHTML('afterbegin','<div class="art-demand-summary">'+parts.map(function(x){return stat(x[0],x[1],'','');}).join('')+'</div>');}
  var charts=document.querySelectorAll('#pane-demand .dstat');charts.forEach(function(el,i){el.insertAdjacentHTML('afterbegin','<div class="art-chart-title">'+(i===0?'需求提出人分布':i===1?'需求部门分布':'按月需求趋势')+'<span>'+(i<2?'占比 + 数量 + 对应需求明细':'每月需求数量 · 按部门堆叠')+'</span></div>');});
  if(charts.length>=2){var grid=document.createElement('div');grid.className='art-chart-grid';charts[0].parentNode.insertBefore(grid,charts[0]);grid.append(charts[0],charts[1]);}
  if(ART_ROLE!=='manager'){
    var table=document.querySelector('#pane-demand .tbl-fluid');
    if(table){table.querySelector('thead tr').insertAdjacentHTML('beforeend','<th>操作</th>');table.querySelectorAll('tbody tr').forEach(function(row){var title=row.querySelector('td>div').textContent;var d=state.demands.filter(function(x){return x.title===title;})[0];if(d)row.insertAdjacentHTML('beforeend','<td><button class="btn sm ghost" onclick="artDemandDetail(\''+d.rid+'\')">查看</button></td>');});}
  }
  artControls();
};
renderLoadChart=function(){ART_RAW.renderLoadChart();var h=document.querySelector('#loadBox .hd h2');if(h&&ART_SCOPE==='mine'&&ART_ROLE!=='manager')h.textContent=state.rankMonth+' 相关项目人员负载';};
function artControls(){
  document.querySelectorAll('button[onclick]').forEach(function(b){var call=b.getAttribute('onclick');if(ART_ROLE!=='manager'&&/^(openProjectModal|delProject|openDemandAssign|saveDemandAssign|clearDemo|importJSON)/.test(call)){b.style.display='none';}if(call.indexOf('openProgressModal(')===0){var id=call.match(/'([^']+)'/);var p=id&&findProject(id[1]);if(!artEdit(p))b.style.display='none';else if(!artLead(p))b.textContent='填写协作进展';}});
  document.querySelectorAll('.pcard').forEach(function(card){var edit=card.querySelector('[onclick^="openProgressModal"]');var id=edit&&edit.getAttribute('onclick').match(/'([^']+)'/);var p=id&&findProject(id[1]);if(p&&!card.querySelector('.art-readonly'))card.insertAdjacentHTML('beforeend','<div class="art-readonly">'+(ART_ROLE==='manager'?'管理人员可维护项目':artLead(p)?'你是主负责人 · 可更新整体进度':artEdit(p)?'你参与协作 · 仅填写个人进展':'全员可读 · 当前无修改权限')+'</div>');});
}
['openProjectModal','saveProject','delProject','openDemandAssign','saveDemandAssign'].forEach(function(k){window[k]=function(){if(ART_ROLE!=='manager'){alert('此操作仅向管理人员开放');return;}return ART_RAW[k].apply(null,arguments);};});
openProgressModal=function(id){var p=findProject(id);if(!artEdit(p)){alert('你不是此项目成员，只能查看');return;}if(!artLead(p)){showModal('填写协作进展 · '+p.name,'<div class="hintbox">你是协作人。填写个人进展，不修改项目整体阶段、日期与状态。</div><div class="frow"><label>填报人</label><input value="'+esc(ART_USER)+'" disabled></div><div class="frow"><label>个人进展 *</label><textarea id="art-collab-work" placeholder="本次完成的工作与下一步安排"></textarea></div><div class="frow"><label>阻塞问题 / 需协助</label><textarea id="art-collab-block"></textarea></div><div class="mact"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="artSaveCollab(\''+id+'\')">保存进展</button></div>');return;}ART_RAW.openProgressModal(id);var filler=document.getElementById('g_filler');if(filler){filler.value=ART_USER;filler.disabled=true;}};
saveProgress=function(id){var p=findProject(id);if(!artLead(p))return;var f=document.getElementById('g_filler');if(f)f.value=ART_USER;ART_RAW.saveProgress(id);};
function artSaveCollab(id){var p=findProject(id);if(!artEdit(p))return;var text=document.getElementById('art-collab-work').value.trim();if(!text){alert('请填写个人进展');return;}addLog({date:TODAY,pid:id,pname:p.name,filler:ART_USER,phase:p.phase,st:'进行中',prog:overallProgress(p),work:text,blocker:document.getElementById('art-collab-block').value.trim(),needHelp:!!document.getElementById('art-collab-block').value.trim(),demo:false});closeModal();refreshAll();}
openDemandModal=function(){ART_RAW.openDemandModal();state.draft.person=ART_USER;var r=requesterOf(ART_USER);state.draft.dept=r?r.m:'信息技术部';refreshDemandModal();};
buildDemandBody=function(){var h=ART_RAW.buildDemandBody();return h.replace('id="d_person"','id="d_person" disabled');};
function artEditDemand(id){var d=state.demands.filter(function(x){return x.rid===id;})[0];if(!d||d.person!==ART_USER)return;showModal('补充需求 · '+d.title,'<div class="hintbox">'+esc(d.returnReason||'补充业务目标与材料')+'</div><div class="frow"><label>补充说明 *</label><textarea id="art-extra">'+esc(d.desc)+'</textarea></div><div class="mact"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="artResubmit(\''+id+'\')">重新提交</button></div>');}
function artResubmit(id){var d=state.demands.filter(function(x){return x.rid===id;})[0];if(!d||d.person!==ART_USER)return;var v=document.getElementById('art-extra').value.trim();if(!v){alert('请补充说明');return;}d.desc=v;d.status='待评估';upsertDemand(d,false);closeModal();refreshAll();}
function artDemandDetail(id){var d=state.demands.filter(function(x){return x.rid===id;})[0];if(!d)return;var p=linkedProjectOf(d);showModal('需求详情 · '+d.title,'<div class="hintbox">'+esc(d.status)+' · '+esc(d.person)+' · '+esc(d.dept)+'</div><div class="f2"><div class="frow"><label>提交时间</label>'+esc(d.ctime||'—')+'</div><div class="frow"><label>期望完成</label>'+esc(d.expect||'—')+'</div></div><div class="frow"><label>需求说明</label><p>'+esc(d.desc||'暂无说明')+'</p></div><div class="frow"><label>需求材料</label>'+attCellFor(d)+'</div>'+(p?'<div class="hintbox">关联项目：'+esc(p.name)+'<br>'+esc(p.phase)+' · '+esc(p.status)+' · 计划完成 '+esc(p.planEnd)+'</div>':'')+'<div class="mact"><button class="btn ghost" onclick="closeModal()">关闭</button>'+(p?'<button class="btn" onclick="openProjectDetail(\''+p.rid+'\')">查看项目进展</button>':'')+(d.person===ART_USER&&(d.status==='待评估'||d.status==='待补充')?'<button class="btn" onclick="artEditDemand(\''+id+'\')">补充说明</button>':'')+'</div>');}
renderBackupTip=function(){document.getElementById('backupTip').innerHTML='';};
renderStatLine=function(){};
var artRefresh=refreshAll;
refreshAll=function(){artRefresh();artControls();};
var artInit=init;
init=function(){state.tab=ART_ROLE==='business'?'demand':'overview';artInit();document.getElementById('sideSync').textContent='独立原型 · 本地演示';};

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
<div class="gtip" id="gtip"></div>
</body>
</html>
