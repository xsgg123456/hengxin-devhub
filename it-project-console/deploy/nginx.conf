map $http_x_forwarded_proto $original_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

log_format itpc_safe escape=json
    '{"time":"$time_iso8601","method":"$request_method","path":"$uri",'
    '"status":$status,"request_time":$request_time}';

server {
    listen 8080;
    access_log /dev/stdout itpc_safe;
    # Nginx error messages may include the raw query or Referer on any failing route.
    # Keep diagnostics in the safe access log and sanitized API application log.
    error_log /dev/null;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api:4322;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_proto;
    }

    location = /health/ready {
        proxy_pass http://api:4322/health/ready;
        access_log off;
    }

    # Preserve the path, query and original Host used by S3 presigned URLs.
    location /it-project-console/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
