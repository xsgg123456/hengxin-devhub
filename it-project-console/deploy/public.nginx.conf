server {
    listen 80;
    access_log off;
    error_log /dev/null;
    return 308 https://pmg.qhhengxin.top:8443$request_uri;
}
server {
    listen 443 ssl;
    server_name pmg.qhhengxin.top;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 100m;
    # Do not inherit the old proxy's query-string access log.
    access_log off;
    error_log /dev/null;
    resolver 127.0.0.11 valid=5s ipv6=off;
    location / {
        if ($http_x_amz_content_sha256 ~* "STREAMING-UNSIGNED-PAYLOAD-TRAILER") {
            return 403 "Unsupported upload encoding.\n";
        }
        set $new_app itpc-prod-web-1:8080;
        proxy_pass http://$new_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
