name: itpc-prod

x-api-environment: &api-environment
  NODE_ENV: production
  DEV_LOGIN: "false"
  HOST: 0.0.0.0
  PORT: "4322"
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: it-project-console

services:
  postgres:
    image: ${POSTGRES_IMAGE:?release.env is required}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: it_project_console
      POSTGRES_USER: it_project_console
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?server.env is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U it_project_console -d it_project_console"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: ${MINIO_IMAGE:?release.env is required}
    platform: linux/amd64
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?server.env is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?server.env is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: ${MC_IMAGE:?release.env is required}
    platform: linux/amd64
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?server.env is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?server.env is required}
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null &&
        mc mb --ignore-existing local/it-project-console &&
        mc anonymous set none local/it-project-console

  migrate:
    image: ${API_IMAGE:?release.env is required}
    platform: linux/amd64
    profiles: [tools]
    env_file: ["${SERVER_ENV_FILE:?absolute server.env path is required}"]
    environment: *api-environment
    depends_on:
      postgres: { condition: service_healthy }
    command: [node, node_modules/prisma/build/index.js, migrate, deploy]

  api:
    image: ${API_IMAGE:?release.env is required}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    env_file: ["${SERVER_ENV_FILE:?absolute server.env path is required}"]
    environment: *api-environment
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4322/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    stop_grace_period: 30s

  web:
    image: ${WEB_IMAGE:?release.env is required}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:${BIND_PORT:-18080}:8080"

volumes:
  postgres-data:
  minio-data:
